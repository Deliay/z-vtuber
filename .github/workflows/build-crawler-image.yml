name: Build crawler Image

on:
  workflow_dispatch:
  push:
    branches:
      - 'release'
      - 'release/**'
    paths:
      - 'servers/crawler/**'
      - 'servers/common/core/**'
      - 'servers/common/live/**'
      - 'servers/common/weibo/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_ENDPOINT }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: servers/crawler/Dockerfile
          tags: |
            ${{ secrets.DOCKER_ENDPOINT }}/zero-tools/z-vtuber-crawler:${{ github.sha }}
            ${{ secrets.DOCKER_ENDPOINT }}/zero-tools/z-vtuber-crawler:latest
          push: true
          provenance: false
          sbom: false
