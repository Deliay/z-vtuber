openapi: 3.1.0
info:
  title: Training Service API
  version: 1.0.0
  description: AI 训练模块「数据集工具」服务 API（数据集/条目管理、从识别结果导入、模型设置 Providers/Models、单条重新识别、批量情绪识别任务与队列）
servers:
  - url: /
paths:
  /health:
    get:
      summary: 健康检查
      operationId: trainingHealth
      responses:
        "200":
          description: 服务存活且 MongoDB 可达
          content:
            text/plain:
              schema:
                type: string
  /api/training/datasets:
    get:
      summary: 查询数据集列表
      description: 按数据集类型过滤，按 CreatedAt 升序返回；本期全量返回（契约预留分页扩展位）。
      operationId: listTrainingDatasets
      parameters:
        - $ref: "#/components/parameters/DatasetTypeQuery"
      responses:
        "200":
          description: 数据集列表（CreatedAt 升序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingDatasetList"
        "400":
          description: '{"error": "unsupported dataset type"}（type 缺失或非 audio）'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: 新建数据集
      description: 名字 trim 后非空且长度 ≤ 128；同类型重名返回 409（MongoDB (Type, Name) 唯一索引）。
      operationId: createTrainingDataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingDatasetCreateRequest"
      responses:
        "201":
          description: 数据集已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingDataset"
        "400":
          description: '{"error": "name is required"}（空）、{"error": "name too long"}（>128）、{"error": "unsupported dataset type"}（type 缺失或非 audio）'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: '{"error": "dataset name exists"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/datasets/{datasetId}:
    put:
      summary: 重命名数据集
      operationId: renameTrainingDataset
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingDatasetRenameRequest"
      responses:
        "200":
          description: 重命名成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingDataset"
        "400":
          description: '{"error": "name is required"} 或 {"error": "name too long"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '{"error": "dataset not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: '{"error": "dataset name exists"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: 删除数据集
      description: 级联删除该数据集下全部条目（先删条目再删数据集；删除幂等可重试）。
      operationId: deleteTrainingDataset
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "204":
          description: 已删除（含条目级联清空）
        "404":
          description: '{"error": "dataset not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/datasets/{datasetId}/items:
    get:
      summary: 查询数据集条目列表
      description: 支撑列表七字段展示与「按来源/按类型分组」；按 CreatedAt、AudioKey 升序返回，本期全量不分页。
      operationId: listTrainingDatasetItems
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/AudioTypeQuery"
        - $ref: "#/components/parameters/SourceQuery"
      responses:
        "200":
          description: 条目列表（CreatedAt、AudioKey 升序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingDatasetItemList"
        "404":
          description: '{"error": "dataset not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/datasets/{datasetId}/items/import:
    post:
      summary: 从识别结果（Transcript）导入条目
      description: >-
        仅导入 status=DONE 的任务；起止时间取任务详情返回值（已叠加任务播放偏移）；
        音频标识 audioKey 以原始时间（返回 start − task.offsetMs）生成，保证任务偏移变更后重复导入仍按 (datasetId, audioKey) 去重；
        重复条目跳过并计入 skipped。
      operationId: importTrainingDatasetItems
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingDatasetImportRequest"
      responses:
        "200":
          description: 导入完成（imported + skipped = 任务片段数）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingDatasetImportResult"
        "400":
          description: '{"error": "task not done"}（任务存在但 status 非 DONE）'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '{"error": "dataset not found"} 或 {"error": "task not found"}（taskId 非法或任务不存在）'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: '{"error": "transcript service unavailable"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/datasets/{datasetId}/items/batch-delete:
    post:
      summary: 批量删除条目
      description: 部分 id 不存在时仍删除其余条目并返回实际删除数。
      operationId: batchDeleteTrainingDatasetItems
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingDatasetBatchDeleteRequest"
      responses:
        "200":
          description: 实际删除条数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingDatasetBatchDeleteResult"
        "404":
          description: '{"error": "dataset not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/datasets/{datasetId}/items/{itemId}:
    put:
      summary: 更新条目
      description: >-
        支持编辑 audioUri/text/startMs/endMs 四个字段：请求中缺失的字段保持不变；
        endMs 显式传 null 表示置空（到音频末尾）；audioUri/text/startMs 显式传 null 返回 400；
        startMs ≥ 0 且 endMs 非空时须 > startMs（startMs 取提交值或现值），否则 400 invalid time range。
      operationId: updateTrainingDatasetItem
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingDatasetItemUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingDatasetItem"
        "400":
          description: '{"error": "invalid time range"}、{"error": "field cannot be null"}（audioUri/text/startMs 显式 null）'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '{"error": "dataset not found"} 或 {"error": "item not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/providers:
    get:
      summary: 查询 Provider 列表
      description: CreatedAt 升序；API key 永不回传，仅以 apiKeySet 表示是否已配置。
      operationId: listTrainingProviders
      responses:
        "200":
          description: Provider 列表（CreatedAt 升序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingProviderList"
    post:
      summary: 新建 Provider
      description: name 全局唯一、type 白名单 openai|claude、endpoint 仅 http/https 且去尾部 `/`；apiKey 写入后不回显。
      operationId: createTrainingProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingProviderCreateRequest"
      responses:
        "201":
          description: Provider 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingProvider"
        "400":
          description: '{"error": "name is required"/"name too long"/"unsupported provider type"/"endpoint is required"/"invalid endpoint"/"api key is required"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: '{"error": "provider name exists"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/providers/{providerId}:
    put:
      summary: 更新 Provider
      description: 缺失字段不变；apiKey 传空串视为不改；重名 409。
      operationId: updateTrainingProvider
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingProviderUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingProvider"
        "400":
          description: '{"error": "name is required"/"name too long"/"unsupported provider type"/"endpoint is required"/"invalid endpoint"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '{"error": "provider not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: '{"error": "provider name exists"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: 删除 Provider
      description: 级联删除其下全部 Models；已入队任务仍保留 modelSlug 快照。
      operationId: deleteTrainingProvider
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "204":
          description: 已删除（含级联删除其下 Models）
        "404":
          description: '{"error": "provider not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/providers/{providerId}/models/discover:
    get:
      summary: 从 Endpoint 同步模型列表
      description: OpenAI-like 调 GET {endpoint}/models、Claude-like 调 GET {endpoint}/v1/models，解析后去重排序返回。
      operationId: discoverTrainingModels
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "200":
          description: 发现的可导入模型列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingModelDiscoverResult"
        "404":
          description: '{"error": "provider not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: '{"error": "provider service unavailable"}（不可达/超时/非 2xx）或 {"error": "invalid provider response"}（响应无法解析）'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/providers/{providerId}/models/import:
    post:
      summary: 批量导入模型
      description: 与 (ProviderId, Model) 唯一索引冲突的计 skipped。
      operationId: importTrainingModels
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingModelImportRequest"
      responses:
        "200":
          description: 导入完成（imported + skipped = 提交数）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingModelImportResult"
        "400":
          description: '{"error": "models is required"/"model too long"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '{"error": "provider not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/models:
    get:
      summary: 查询模型列表
      description: 每项含服务端拼好的 slug（{providerName}/{model}）。
      operationId: listTrainingModels
      parameters:
        - $ref: "#/components/parameters/TrainingModelEnabledQuery"
      responses:
        "200":
          description: 模型列表（CreatedAt 升序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingModelList"
    post:
      summary: 手动添加模型
      operationId: createTrainingModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingModelCreateRequest"
      responses:
        "201":
          description: 模型已添加
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingModel"
        "400":
          description: '{"error": "model is required"/"model too long"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '{"error": "provider not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: '{"error": "model exists"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/models/{modelId}:
    put:
      summary: 更新模型
      description: 缺失字段不变；改名撞唯一索引 409。
      operationId: updateTrainingModel
      parameters:
        - $ref: "#/components/parameters/ModelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingModelUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingModel"
        "400":
          description: '{"error": "model is required"/"model too long"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '{"error": "model not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: '{"error": "model exists"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: 删除模型
      operationId: deleteTrainingModel
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "204":
          description: 已删除
        "404":
          description: '{"error": "model not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/datasets/{datasetId}/items/{itemId}/recognize:
    post:
      summary: 单条重新识别
      description: 服务端取音频转 base64 携识别 prompt 调模型要求 JSON 输出，仅返回文本、不写库（保存由前端走更新条目端点）。
      operationId: recognizeTrainingDatasetItem
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingRecognizeRequest"
      responses:
        "200":
          description: 识别结果（仅文本，不写库）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingRecognizeResult"
        "400":
          description: '{"error": "model does not support audio input"/"audio uri is empty"/"audio too large"/"model disabled"/"unsupported provider type"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '{"error": "dataset not found"/"item not found"/"model not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: '{"error": "audio unavailable"/"model service unavailable"/"invalid model output"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/datasets/{datasetId}/items/emotion-tasks:
    post:
      summary: 提交情绪识别任务
      description: skipped 口径——条目已有 PENDING/RUNNING 任务（重复提交幂等，并发由唯一索引兜底）、条目 text 为空、itemIds 非法或条目不存在。
      operationId: createTrainingEmotionTasks
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingEmotionTaskCreateRequest"
      responses:
        "200":
          description: 提交结果（created + skipped = 提交条目数）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingEmotionTaskCreateResult"
        "400":
          description: '{"error": "itemIds is required"/"model disabled"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '{"error": "dataset not found"/"model not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/emotion-tasks:
    get:
      summary: 查询情绪识别任务队列
      description: 按 datasetId/status 过滤，CreatedAt 降序，limit 默认 100 最大 500；counts 为各状态分组计数。
      operationId: listTrainingEmotionTasks
      parameters:
        - $ref: "#/components/parameters/EmotionDatasetIdQuery"
        - $ref: "#/components/parameters/EmotionStatusQuery"
        - $ref: "#/components/parameters/EmotionLimitQuery"
      responses:
        "200":
          description: 任务列表与状态计数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingEmotionTaskList"
  /api/training/emotion-tasks/{taskId}/retry:
    post:
      summary: 重试失败任务
      description: 仅 FAILED → PENDING（原子 CAS：Id + Status==FAILED）；attempts 保留、error 清空。同条目已有其他活跃任务时 409。
      operationId: retryTrainingEmotionTask
      parameters:
        - $ref: "#/components/parameters/EmotionTaskId"
      responses:
        "200":
          description: 任务已置回 pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingEmotionTask"
        "400":
          description: '{"error": "task not failed"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '{"error": "task not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: '{"error": "active task exists"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/datasets/{datasetId}/synthesize:
    post:
      summary: 音频生成（数据集语音合成）
      description: >-
        以数据集为参考池：按输入文本与条目文本的字符相似度（归一化编辑距离，兼顾内容与长度）匹配音色参考
        （speaker_prompt），情感向量匹配情绪参考（emo_prompt/emo_vector/emo_text/emo_alpha），
        调用内网 index-tts-api 合成并返回 audio/wav。
        命中经 X-Speaker-Audio-Key / X-Emo-Audio-Key 响应头可观测。
        emotionMode=none（默认）不传任何情绪参考直接合成；emotionMode=llm 用配置的可用模型生成情感向量后检索；
        emotionMode=dataset 跳过大模型，直接使用音色命中候选条目自身的 Extensions.emotion
        （无则沿音色候选向下找，全无则降级中性）。dataset/none 完全跳过 modelId/模型解析。
      operationId: synthesizeTrainingDataset
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - $ref: "#/components/parameters/EmotionModeQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingSynthesizeRequest"
      responses:
        "200":
          description: 合成音频（mono 16-bit PCM WAV @22.05kHz，上游透传）
          headers:
            X-Speaker-Audio-Key:
              description: 命中的音色参考条目 audioKey
              schema:
                type: string
            X-Emo-Audio-Key:
              description: 命中的情绪参考条目 audioKey（无情绪命中时缺省）
              schema:
                type: string
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "400":
          description: '{"error": "text is required"/"invalid lang"/"invalid emotion mode"/"model disabled"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: '{"error": "dataset not found"/"model not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: '{"error": "no speaker reference"}（数据集内无任何可用音色参考）'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: '{"error": "audio unavailable"/"tts service unavailable"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/training/datasets/{datasetId}/vectors/rebuild:
    post:
      summary: 重建数据集向量索引
      description: >-
        从 MongoDB 条目（Text + Extensions.emotion）为 Milvus 重建文本向量与情感向量索引，返回重建条数（updated）。
        用于升级后回填存量条目、向量模型变更后重建。
      operationId: rebuildTrainingDatasetVectors
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: 重建结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingVectorsRebuildResult"
        "404":
          description: '{"error": "dataset not found"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: '{"error": "embedding service unavailable"/"vector store unavailable"}'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    DatasetId:
      name: datasetId
      in: path
      required: true
      description: 数据集 id（ObjectId）
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      description: 条目 id（ObjectId）
      schema:
        type: string
    DatasetTypeQuery:
      name: type
      in: query
      required: true
      description: 数据集类型，本期固定 audio（预留其他模态 Tab）
      schema:
        type: string
    AudioTypeQuery:
      name: audioType
      in: query
      required: false
      description: 按音频类型过滤（如 transcript），支撑「按类型分组」
      schema:
        type: string
    SourceQuery:
      name: source
      in: query
      required: false
      description: 按音频来源过滤（如某个 transcript 任务 id），支撑「按来源分组」
      schema:
        type: string
    ProviderId:
      name: providerId
      in: path
      required: true
      description: Provider id（ObjectId）
      schema:
        type: string
    ModelId:
      name: modelId
      in: path
      required: true
      description: 模型 id（ObjectId）
      schema:
        type: string
    EmotionTaskId:
      name: taskId
      in: path
      required: true
      description: 情绪识别任务 id（ObjectId）
      schema:
        type: string
    TrainingModelEnabledQuery:
      name: enabled
      in: query
      required: false
      description: 按启用状态过滤
      schema:
        type: boolean
    EmotionDatasetIdQuery:
      name: datasetId
      in: query
      required: false
      description: 按数据集过滤
      schema:
        type: string
    EmotionStatusQuery:
      name: status
      in: query
      required: false
      description: 按任务状态过滤 pending/running/done/failed
      schema:
        type: string
    EmotionLimitQuery:
      name: limit
      in: query
      required: false
      description: 返回条数上限，默认 100、最大 500
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    EmotionModeQuery:
      name: emotionMode
      in: query
      required: false
      description: >-
        情绪参考生成模式（大小写不敏感）：none（默认）不传任何情绪参考；
        llm 用配置的可用模型生成情感向量后向量匹配；
        dataset 跳过大模型，直接使用文本向量命中条目自身的 Extensions.emotion（无则沿音色候选向下找，
        全无则降级中性）。dataset/none 完全跳过 modelId/模型解析。
      schema:
        type: string
        enum: [llm, dataset, none]
        default: none
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    TrainingDataset:
      type: object
      required: [id, name, type, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
          description: 数据集名字（trim 后非空，长度 ≤ 128）
        type:
          type: string
          description: 数据集类型，本期固定 audio
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TrainingDatasetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 按 CreatedAt 升序
          items:
            $ref: "#/components/schemas/TrainingDataset"
    TrainingDatasetCreateRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          description: 本期固定 audio
    TrainingDatasetRenameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    TrainingDatasetItem:
      type: object
      required: [id, datasetId, audioType, source, audioUri, audioKey, startMs, text, createdAt, updatedAt]
      properties:
        id:
          type: string
        datasetId:
          type: string
        audioType:
          type: string
          description: 音频类型，本期支持 transcript（开放枚举，新增类型加新值）
        source:
          type: string
          description: 音频来源（transcript 类型 = 识别任务 id），支撑「按来源分组」
        audioUri:
          type: string
          description: 音频地址；transcript 类型为录播文件 uri（b/live/{roomId}/recordings/{fileName}），为空表示暂无可用音频
        audioKey:
          type: string
          description: >-
            数据集内唯一的音频标识，带类型前缀：transcript:{taskId}:{原始startMs}。
            原始 start = 任务详情返回的 start − 任务 offsetMs（不含播放偏移），
            保证任务偏移变更后重复导入仍命中 (datasetId, audioKey) 唯一索引而被去重。
        startMs:
          type: integer
          format: int64
          description: 基于音频地址的开始时间（毫秒，含任务播放偏移的展示口径），默认 0，不可为负
        endMs:
          type: integer
          format: int64
          nullable: true
          description: 基于音频地址的结束时间（毫秒，含任务播放偏移的展示口径）；null = 到音频末尾
        text:
          type: string
          description: 片段文本
        extensions:
          type: object
          nullable: true
          additionalProperties: true
          description: 扩展信息承载（预留：情感识别/二次 ASR 等加工结果按键名挂接）
        emotion:
          description: 情绪识别结果（由 Extensions.emotion 映射；缺失/格式不符即 null）
          oneOf:
            - $ref: "#/components/schemas/EmotionResult"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TrainingDatasetItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 按 CreatedAt、AudioKey 升序
          items:
            $ref: "#/components/schemas/TrainingDatasetItem"
    TrainingDatasetImportRequest:
      type: object
      required: [taskId]
      properties:
        taskId:
          type: string
          description: 识别任务 id（仅 status=DONE 的任务可导入）
    TrainingDatasetImportResult:
      type: object
      required: [imported, skipped]
      properties:
        imported:
          type: integer
          description: 实际写入条数
        skipped:
          type: integer
          description: 因 (datasetId, audioKey) 唯一索引去重而跳过的条数
    TrainingDatasetItemUpdateRequest:
      type: object
      description: 缺失字段保持不变；endMs 传 null 表示置空；audioUri/text/startMs 传 null 返回 400
      properties:
        audioUri:
          type: string
          description: 音频地址（缺失 = 不变，null = 400）
        text:
          type: string
          description: 片段文本（缺失 = 不变，null = 400）
        startMs:
          type: integer
          format: int64
          description: 开始时间（毫秒，≥ 0；缺失 = 不变，null = 400）
        endMs:
          type: integer
          format: int64
          nullable: true
          description: 结束时间（毫秒）；null = 置空（到音频末尾）；非空须 > startMs
    TrainingDatasetBatchDeleteRequest:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          description: 待删除条目 id 列表
          items:
            type: string
    TrainingDatasetBatchDeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          description: 实际删除条数（不存在的 id 跳过）
    TrainingProvider:
      type: object
      required: [id, name, type, endpoint, apiKeySet, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
          description: 名称（trim 后非空 ≤ 64，全局唯一）
        type:
          type: string
          description: 模型类型 openai | claude（开放枚举）
        endpoint:
          type: string
          description: 服务地址（http/https，去尾部 /）
        apiKeySet:
          type: boolean
          description: 是否已配置 API key（明文永不回传）
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TrainingProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 按 CreatedAt 升序
          items:
            $ref: "#/components/schemas/TrainingProvider"
    TrainingProviderCreateRequest:
      type: object
      required: [name, type, endpoint, apiKey]
      properties:
        name:
          type: string
        type:
          type: string
        endpoint:
          type: string
        apiKey:
          type: string
    TrainingProviderUpdateRequest:
      type: object
      description: 缺失字段不变；apiKey 传空串视为不改
      properties:
        name:
          type: string
        type:
          type: string
        endpoint:
          type: string
        apiKey:
          type: string
    TrainingModel:
      type: object
      required: [id, providerId, providerName, model, slug, enabled, createdAt, updatedAt]
      properties:
        id:
          type: string
        providerId:
          type: string
        providerName:
          type: string
          description: 所属 Provider 名称
        model:
          type: string
          description: 实际发给服务商的模型 ID
        slug:
          type: string
          description: "{providerName}/{model}，服务端拼好供展示"
        enabled:
          type: boolean
          description: 是否启用（默认 true）
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TrainingModelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TrainingModel"
    TrainingModelCreateRequest:
      type: object
      required: [providerId, model]
      properties:
        providerId:
          type: string
        model:
          type: string
    TrainingModelUpdateRequest:
      type: object
      description: 缺失字段不变
      properties:
        model:
          type: string
        enabled:
          type: boolean
    TrainingModelDiscoverResult:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/TrainingDiscoveredModel"
    TrainingDiscoveredModel:
      type: object
      required: [model]
      properties:
        model:
          type: string
    TrainingModelImportRequest:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            type: string
    TrainingModelImportResult:
      type: object
      required: [imported, skipped]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
    EmotionResult:
      type: object
      description: 结构化情绪数据（十字段固定结构）
      required: [emotionControlWeight, emotionDescription, happy, angry, sad, afraid, disgusted, melancholic, surprised, calm]
      properties:
        emotionControlWeight:
          type: number
          description: 情绪控制权重（0~10，服务端越界钳制）
        emotionDescription:
          type: string
          description: 情绪描述（服务端截断至 ≤ 200 字）
        happy:
          type: number
          description: 开心（0~1）
        angry:
          type: number
          description: 愤怒（0~1）
        sad:
          type: number
          description: 悲伤（0~1）
        afraid:
          type: number
          description: 恐惧（0~1）
        disgusted:
          type: number
          description: 厌恶（0~1）
        melancholic:
          type: number
          description: 忧郁（0~1）
        surprised:
          type: number
          description: 惊讶（0~1）
        calm:
          type: number
          description: 平静（0~1）
    TrainingEmotionTask:
      type: object
      required: [id, datasetId, itemId, audioKey, modelId, modelSlug, status, attempts, error, emotion, createdAt, startedAt, finishedAt]
      properties:
        id:
          type: string
        datasetId:
          type: string
        itemId:
          type: string
        audioKey:
          type: string
          description: 条目音频标识快照
        modelId:
          type: string
        modelSlug:
          type: string
          description: slug 快照（模型删除后任务仍可读）
        status:
          type: string
          description: pending | running | done | failed
        attempts:
          type: integer
          description: 执行次数（重试累加）
        error:
          type: string
          nullable: true
          description: 失败原因
        emotion:
          description: 识别结果快照（DONE 时写入）
          oneOf:
            - $ref: "#/components/schemas/EmotionResult"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
    TrainingEmotionTaskList:
      type: object
      required: [items, counts]
      properties:
        items:
          type: array
          description: 按 CreatedAt 降序
          items:
            $ref: "#/components/schemas/TrainingEmotionTask"
        counts:
          $ref: "#/components/schemas/TrainingEmotionTaskCounts"
    TrainingEmotionTaskCounts:
      type: object
      required: [pending, running, done, failed]
      properties:
        pending:
          type: integer
        running:
          type: integer
        done:
          type: integer
        failed:
          type: integer
    TrainingRecognizeRequest:
      type: object
      required: [modelId]
      properties:
        modelId:
          type: string
    TrainingRecognizeResult:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: 识别出的文本（未写库，保存由前端走更新条目端点）
    TrainingSynthesizeRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: 待合成文本（trim 后非空）
        lang:
          type: string
          nullable: true
          description: 语种 ZH/EN/JA/ES/AR（大小写不敏感），缺省 Tts:DefaultLang（默认 ZH）
        modelId:
          type: string
          nullable: true
          description: 生成情感向量所用可用模型 id（Models 管理配置）；缺省 Synthesize:DefaultEmotionModelId，再缺省首个启用模型
    TrainingVectorsRebuildResult:
      type: object
      required: [updated]
      properties:
        updated:
          type: integer
          description: 重建（写入 Milvus）的条目数
    TrainingEmotionTaskCreateRequest:
      type: object
      required: [itemIds, modelId]
      properties:
        itemIds:
          type: array
          items:
            type: string
        modelId:
          type: string
    TrainingEmotionTaskCreateResult:
      type: object
      required: [created, skipped]
      properties:
        created:
          type: integer
        skipped:
          type: integer
