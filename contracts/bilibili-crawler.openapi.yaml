openapi: 3.1.0
info:
  title: Bilibili Live Crawler API
  version: 1.0.0
  description: B站主播数据抓取与订阅服务对外数据接口（统一前缀 /api/b）
servers:
  - url: /
paths:
  /api/b/cookie:
    get:
      summary: 查询活跃 Cookie 列表
      operationId: listActiveCookies
      responses:
        "200":
          description: 活跃 Cookie 列表（不含明文 Cookie）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieList"
    post:
      summary: 录入 Cookie
      operationId: addCookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CookieAddRequest"
      responses:
        "200":
          description: 录入成功（幂等）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieItem"
        "400":
          description: Cookie 为空
  /api/b/subscription:
    get:
      summary: 获取订阅主播列表
      operationId: listSubscriptions
      responses:
        "200":
          description: 订阅主播 mid 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionList"
    post:
      summary: 订阅主播
      operationId: subscribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "200":
          description: 订阅成功（幂等）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionItem"
        "400":
          description: mid 非法或 type 缺失/非法（合法取值：danmaku, dynamic）
  /api/b/subscription/{mid}:
    delete:
      summary: 取消订阅
      operationId: unsubscribe
      parameters:
        - $ref: "#/components/parameters/Mid"
        - name: type
          in: query
          required: true
          description: 订阅类型（danmaku 或 dynamic），缺失或非法返回 400。
          schema:
            type: string
            enum: [danmaku, dynamic]
      responses:
        "204":
          description: 取消成功
        "400":
          description: type 缺失或非法（合法取值：danmaku, dynamic）
        "404":
          description: 未订阅
  /api/b/user/{mid}:
    get:
      summary: 查询主播账号基本信息
      operationId: getAccountBasicInfo
      parameters:
        - $ref: "#/components/parameters/Mid"
      responses:
        "200":
          description: bilibili_account_basic_info 最新一条完整 Data
          content:
            application/json:
              schema:
                type: object
        "404":
          description: 未抓取过该主播
  /api/b/user/{mid}/space:
    get:
      summary: 分页查询空间动态
      description: 按动态 ID（dynamicId）倒序分页查询空间动态。B 站动态 ID 为单调递增的数值字符串，倒序即创建时间倒序，最新动态排在最前。
      operationId: listSpaceTimeline
      parameters:
        - $ref: "#/components/parameters/Mid"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StartedAt"
        - $ref: "#/components/parameters/EndedAt"
      responses:
        "200":
          description: 空间动态分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceTimelinePage"
  /api/b/live/{roomId}/state/all:
    get:
      summary: 分页查询直播状态历史
      operationId: listLiveStates
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StartedAt"
        - $ref: "#/components/parameters/EndedAt"
      responses:
        "200":
          description: 直播状态分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatePage"
  /api/b/live/{roomId}/state/current:
    get:
      summary: 查询当前直播状态
      operationId: getCurrentLiveState
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: created_at 最新一条 bilibili_live_status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveState"
        "404":
          description: 无记录
  /api/b/live/{roomId}/history:
    get:
      summary: 分页查询直播间历史场次
      description: 按开播时间（startDate）倒序分页查询 bilibili_live_session，最新开播的场次排在最前。
      operationId: listLiveSessionHistory
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StartedAt"
        - $ref: "#/components/parameters/EndedAt"
      responses:
        "200":
          description: 直播间历史场次分页（按 startDate 倒序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSessionHistoryPage"
  /api/b/live/{roomId}/event/subscribe:
    get:
      summary: 订阅直播间实时事件（SSE）
      description: 订阅直播间实时事件，可传入一个或多个 type 仅推送匹配类型的事件，不传 type 推送全部类型。
      operationId: subscribeLiveEvents
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/EventType"
      responses:
        "200":
          description: text/event-stream，仅推送连接建立之后的事件
          content:
            text/event-stream:
              schema:
                type: string
  /api/b/live/{roomId}/event/range:
    get:
      summary: 分页查询直播间事件
      description: 按发生时间（occurredAt）降序分页查询直播间事件，可按事件类型（type）与可选时间范围（startedAt/endedAt，含起止边界）筛选；支持按礼物金额下限（minPrice）筛选，仅作用于 gift 类型事件；startedAt 晚于 endedAt 或 minPrice 非法时返回 400。
      operationId: listLiveEventsRange
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/StartedAt"
        - $ref: "#/components/parameters/EndedAt"
        - $ref: "#/components/parameters/MinPrice"
      responses:
        "200":
          description: 直播间事件分页（按 occurredAt 降序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveEventPage"
        "400":
          description: 时间范围非法或 minPrice 非法（小于 0.01 或非数值）
  /api/b/live/{roomId}/event/search:
    get:
      summary: 搜索直播间文字事件（弹幕/SC）
      description: 在弹幕和醒目留言（SC）的纯文本内容、发送者用户名、粉丝牌名称中进行不区分大小写的子串匹配；纯数字关键词额外按发送者 UID 精确匹配，任一命中即返回。按发生时间（occurredAt）降序分页返回匹配的事件。搜索范围仅限弹幕（danmaku）和醒目留言（super_chat）类型。
      operationId: searchLiveEvents
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StringCriteria"
      responses:
        "200":
          description: 搜索结果分页（按 occurredAt 降序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveEventPage"
        "400":
          description: stringCriteria 非法（缺失、空串、纯空白、超过 200 字符）
components:
  parameters:
    Mid:
      name: mid
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    EventType:
      name: type
      in: query
      required: false
      description: 事件类型筛选，可重复传入（如 type=danmaku&type=gift），多值为合集，不传返回全部类型。
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    StartedAt:
      name: startedAt
      in: query
      required: false
      description: 筛选起始时间（含边界，UTC，ISO 8601）。space 端点按动态发布时间（pub_ts）过滤且 pub_ts 缺失的记录被排除；state/all 按记录创建时间（createdAt）过滤；history 按开播时间（startDate）过滤；event/range 按事件发生时间（occurredAt）过滤。
      schema:
        type: string
        format: date-time
    EndedAt:
      name: endedAt
      in: query
      required: false
      description: 筛选结束时间（含边界，UTC，ISO 8601）。过滤语义同 startedAt；event/range 按事件发生时间（occurredAt）过滤。当 startedAt 晚于 endedAt 时返回 400。
      schema:
        type: string
        format: date-time
    MinPrice:
      name: minPrice
      in: query
      required: false
      description: 礼物金额下限（元），最小 0.01，含边界；仅作用于 gift 类型事件，其他类型不受影响；不传不限制；小于 0.01 或大于 9000000000000000 或非数值返回 400。
      schema:
        type: number
        minimum: 0.01
        maximum: 9000000000000000
    StringCriteria:
      name: stringCriteria
      in: query
      required: true
      description: 搜索关键词，在弹幕/SC 的纯文本、发送者用户名、粉丝牌名称中做不区分大小写子串匹配，任一命中即返回；纯数字关键词额外按发送者 UID 精确匹配；非空且非纯空白，最长 200 字符；缺失、为空、仅空白或超长返回 400。
      schema:
        type: string
        maxLength: 200
  schemas:
    CookieAddRequest:
      type: object
      required: [cookie]
      properties:
        cookie:
          type: string
    CookieItem:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [active, offline]
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    CookieList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CookieItem"
    SubscribeRequest:
      type: object
      required: [mid, type]
      properties:
        mid:
          type: integer
          format: int64
        type:
          type: string
          enum: [danmaku, dynamic]
          description: 订阅类型（danmaku 弹幕 / dynamic 动态），必填。
    SubscriptionItem:
      type: object
      properties:
        mid:
          type: integer
          format: int64
        type:
          type: string
          enum: [danmaku, dynamic]
          description: 订阅类型
        subscribedAt:
          type: string
          format: date-time
    SubscriptionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionItem"
    LiveState:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        title:
          type: string
        liveStatus:
          type: boolean
        liveSessionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    LiveStatePage:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LiveState"
    LiveSession:
      type: object
      properties:
        liveId:
          type: string
        roomId:
          type: integer
          format: int64
        title:
          type: string
        coverUrl:
          type: string
          nullable: true
        parentArea:
          type: string
          nullable: true
        area:
          type: string
          nullable: true
        isFinish:
          type: boolean
        startDate:
          type: string
          format: date-time
        stopDate:
          type: string
          format: date-time
          nullable: true
        danmakuCount:
          type: integer
          format: int64
        totalIncome:
          type: number
          format: double
        watchCount:
          type: integer
          format: int64
        likeCount:
          type: integer
          format: int64
        payCount:
          type: integer
          format: int64
        maxOnlineCount:
          type: integer
          format: int64
    LiveSessionHistoryPage:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LiveSession"
    SpaceTimelineItem:
      type: object
      properties:
        mid:
          type: integer
          format: int64
        dynamicId:
          type: string
        fetchedAt:
          type: string
          format: date-time
        data:
          type: object
    SpaceTimelinePage:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpaceTimelineItem"
    LiveEvent:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        type:
          type: string
        occurredAt:
          type: string
          format: date-time
        liveSessionId:
          type: string
          nullable: true
        payload:
          type: object
    LiveEventPage:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LiveEvent"
