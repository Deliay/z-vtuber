        "502":
          description: training 服务不可达
  /api/training/datasets/{datasetId}/synthesize:
    post:
      summary: 音频生成（代理训练服务）
      description: >-
        代理 training 服务，body 原样透传；成功返回 audio/wav 二进制（Content-Type 与响应体透传），
        X-Speaker-Audio-Key / X-Emo-Audio-Key 命中头一并透传；错误码（400/404/409/502）与错误体透传。
        query emotionMode（llm/dataset/none）原样透传。
      operationId: synthesizeTrainingDataset
      parameters:
        - $ref: "#/components/parameters/TrainingDatasetId"
        - $ref: "#/components/parameters/TrainingEmotionModeQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingSynthesizeRequest"
      responses:
        "200":
          description: 合成音频（audio/wav 二进制透传）
          headers:
            X-Speaker-Audio-Key:
              description: 命中的音色参考条目 audioKey（拼接路径为逗号分隔多值，按拼接顺序；回退路径为单值）
              schema:
                type: string
            X-Emo-Audio-Key:
              description: 命中的情绪参考条目 audioKey（无情绪命中时缺省）
              schema:
                type: string
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        "400":
          description: 请求非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingErrorResponse"
        "404":
          description: 数据集或模型不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingErrorResponse"
        "409":
          description: 数据集内无可用音色参考
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingErrorResponse"
        "502":
          description: training 服务不可达（或上游音频/TTS 不可用）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingErrorResponse"
  /api/training/datasets/{datasetId}/vectors/rebuild:
    post:
      summary: 重建数据集向量索引（代理训练服务）
      description: 代理 training 服务，body 原样透传；返回 updated 条数。
      operationId: rebuildTrainingDatasetVectors
      parameters:
        - $ref: "#/components/parameters/TrainingDatasetId"
      responses:
        "200":
          description: 重建结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingVectorsRebuildResult"
        "404":
          description: 数据集不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingErrorResponse"
        "502":
          description: training 服务不可达
  /api/training/datasets/{datasetId}/segments/rebuild:
    post:
      summary: 重建数据集候选短句拼音反向索引（代理训练服务）
      description: 代理 training 服务，body 原样透传；返回 rebuilt 候选短句总数。
      operationId: rebuildTrainingDatasetSegments
      parameters:
        - $ref: "#/components/parameters/TrainingDatasetId"
      responses:
        "200":
          description: 重建结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSegmentsRebuildResult"
        "404":
          description: 数据集不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingErrorResponse"
        "502":
          description: training 服务不可达
  /api/training/datasets/{datasetId}/export:
    get:
      summary: 导出数据集为 zip（代理训练服务）
      description: >-
        代理 training 服务，query 原样透传；成功 200 以 application/zip 流式透传响应体
        （无 Content-Length）与 Content-Disposition（attachment; filename*=UTF-8''{urlencoded 数据集名}.zip）
        及 Cache-Control: no-store，训练侧打包与跳过口径见 training 契约；
        404 数据集不存在与 502 training service unavailable 错误体透传。
      operationId: exportTrainingDataset
      parameters:
        - $ref: "#/components/parameters/TrainingDatasetId"
      responses:
        "200":
          description: 导出的 zip 二进制流（Content-Type / Content-Disposition 透传，无 Content-Length）
          headers:
            Content-Disposition:
              description: "attachment; filename*=UTF-8''{urlencoded 数据集名}.zip"
              schema:
                type: string
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: 数据集不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingErrorResponse"
        "502":
          description: training 服务不可达
  /api/training/images/generate:
    post:
      summary: 绘图生成（代理训练服务）
      description: >-
        代理 training 服务，multipart/form-data 请求体（text + image × 1..N（同名字段重复提交）+ 可选
        modelId）与 Content-Type（含 boundary）原样透传；training 上游以 response_format=b64_json 调
        OpenAI-like /images/edits 取回图片。成功返回 image/png 二进制（Content-Type 与响应体透传），
        错误码（400/404/409/502）与错误体透传，上游不可达 502 training service unavailable。
      operationId: generateTrainingImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TrainingImageGenerateRequest"
      responses:
        "200":
          description: 生成的图片二进制（image/png 透传）
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: 请求非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingErrorResponse"
        "404":
          description: 模型不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingErrorResponse"
        "409":
          description: 无可用图片模型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingErrorResponse"
        "502":
          description: training 服务不可达（或上游模型服务不可用/输出非法）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingErrorResponse"
components:
  parameters:
    TrainingDatasetId:
      name: datasetId
      in: path
      required: true
      description: 数据集 id（ObjectId）
      schema:
        type: string
    TrainingItemId:
      name: itemId
      in: path
      required: true
      description: 条目 id（ObjectId）
      schema:
        type: string
    TrainingTypeQuery:
      name: type
      in: query
      required: true
      description: 数据集类型，本期固定 audio
      schema:
        type: string
    TrainingAudioTypeQuery:
      name: audioType
      in: query
      required: false
      description: 按音频类型过滤（如 transcript）
      schema:
        type: string
    TrainingSourceQuery:
      name: source
      in: query
      required: false
      description: 按音频来源过滤（如某个 transcript 任务 id）
      schema:
        type: string
    TrainingProviderId:
      name: providerId
      in: path
      required: true
      description: Provider id（ObjectId）
      schema:
        type: string
    TrainingModelId:
      name: modelId
      in: path
      required: true
      description: 模型 id（ObjectId）
      schema:
        type: string
    TrainingEmotionTaskId:
      name: taskId
      in: path
      required: true
      description: 情绪识别任务 id（ObjectId）
      schema:
        type: string
    TrainingModelEnabledQuery:
      name: enabled
      in: query
      required: false
      description: 按启用状态过滤
      schema:
        type: boolean
    TrainingModelInputQuery:
      name: input
      in: query
      required: false
      description: 逗号分隔的所需输入能力；模型输入能力须覆盖该集合
      schema:
        type: string
    TrainingModelOutputQuery:
      name: output
      in: query
      required: false
      description: 逗号分隔的所需输出能力；模型输出能力须覆盖该集合
      schema:
        type: string
    TrainingFeaturePointSlug:
      name: slug
      in: path
      required: true
      description: 功能点标识
      schema:
        type: string
    TrainingEmotionDatasetIdQuery:
      name: datasetId
      in: query
      required: false
      description: 按数据集过滤
      schema:
        type: string
    TrainingEmotionStatusQuery:
      name: status
      in: query
      required: false
      description: 按任务状态过滤 pending/running/done/failed
      schema:
        type: string
    TrainingEmotionLimitQuery:
      name: limit
      in: query
      required: false
      description: 返回条数上限，默认 100、最大 500
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    TrainingEmotionModeQuery:
      name: emotionMode
      in: query
      required: false
      description: >-
        情绪参考生成模式（透传 training，大小写不敏感）：none（默认）不传任何情绪参考；
        llm 用配置的可用模型生成情感向量后向量匹配；
        dataset 跳过大模型，直接使用文本向量命中条目自身的 Extensions.emotion。
        dataset/none 跳过 modelId/模型解析。
      schema:
        type: string
        enum: [llm, dataset, none]
        default: none
    Mid:
      name: mid
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Range:
      name: Range
      in: header
      required: false
      description: 字节区间请求，如 bytes=0-1023；仅支持单区间，多区间请求回退为 200 返回完整文件
      schema:
        type: string
    IfRange:
      name: If-Range
      in: header
      required: false
      description: 条件 Range，校验失败（值与当前文件不匹配）时回退为 200 返回完整文件
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    EventType:
      name: type
      in: query
      required: false
      description: 事件类型筛选，可重复传入（如 type=danmaku&type=gift），多值为合集，不传返回全部类型。
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    StartedAt:
      name: startedAt
      in: query
      required: false
      description: 筛选起始时间（含边界，UTC，ISO 8601）。space 端点按动态发布时间（pub_ts）过滤且 pub_ts 缺失的记录被排除；state/all 按记录创建时间（createdAt）过滤；history 按开播时间（startDate）过滤；event/range 按事件发生时间（occurredAt）过滤。
      schema:
        type: string
        format: date-time
    EndedAt:
      name: endedAt
      in: query
      required: false
      description: 筛选结束时间（含边界，UTC，ISO 8601）。过滤语义同 startedAt；event/range 按事件发生时间（occurredAt）过滤。当 startedAt 晚于 endedAt 时返回 400。
      schema:
        type: string
        format: date-time
    MinPrice:
      name: minPrice
      in: query
      required: false
      description: 礼物金额下限（元），最小 0.01，含边界；仅作用于 gift/gift_v2 礼物类事件，其他类型不受影响；不传不限制；小于 0.01 或大于 9000000000000000 或非数值返回 400。
      schema:
        type: number
        minimum: 0.01
        maximum: 9000000000000000
    StringCriteria:
      name: stringCriteria
      in: query
      required: true
      description: 搜索关键词，在弹幕/SC 的纯文本、发送者用户名、粉丝牌名称中做不区分大小写子串匹配，任一命中即返回；纯数字关键词额外按发送者 UID 精确匹配；非空且非纯空白，最长 200 字符；缺失、为空、仅空白或超长返回 400。
      schema:
        type: string
        maxLength: 200
    StartedDate:
      name: startedAt
      in: query
      required: true
      description: 查询起始日期（yyyy-MM-dd，北京时间，含边界，起日 00:00 至止日 23:59:59 全天含边界）。
      schema:
        type: string
        format: date
    EndedDate:
      name: endedAt
      in: query
      required: true
      description: 查询结束日期（yyyy-MM-dd，北京时间，含边界，起日 00:00 至止日 23:59:59 全天含边界）。当 startedAt 晚于 endedAt 时返回 400。
      schema:
        type: string
        format: date
    OnboardMode:
      name: mode
      in: query
      required: false
      description: 统计口径：any=范围内任意一天在舰即计入（默认），all=范围内每一天都在舰才计入。
      schema:
        type: string
        enum: [any, all]
        default: any
    TranscriptRoomIdQuery:
      name: roomId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    TranscriptRecordingIdQuery:
      name: recordingId
      in: query
      required: false
      description: 按录播场次过滤
      schema:
        type: string
    TranscriptTaskStatusQuery:
      name: status
      in: query
      required: false
      description: 按任务状态过滤
      schema:
        $ref: "#/components/schemas/RecordingTranscriptTaskStatus"
    TranscriptTaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    TranscriptModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
    TranscriptLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 50
    TranscriptBefore:
      name: before
      in: query
      required: false
