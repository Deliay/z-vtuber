openapi: 3.1.0
info:
  title: Bilibili Live Crawler API
  version: 1.0.0
  description: B站主播数据抓取与订阅服务对外数据接口（统一前缀 /api/b）
servers:
  - url: /
paths:
  /api/b/cookie:
    get:
      summary: 查询活跃 Cookie 列表
      operationId: listActiveCookies
      responses:
        "200":
          description: 活跃 Cookie 列表（不含明文 Cookie）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieList"
    post:
      summary: 录入 Cookie
      operationId: addCookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CookieAddRequest"
      responses:
        "200":
          description: 录入成功（幂等）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieItem"
        "400":
          description: Cookie 为空
  /api/b/subscription:
    get:
      summary: 获取订阅主播列表
      operationId: listSubscriptions
      responses:
        "200":
          description: 订阅主播 mid 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionList"
    post:
      summary: 订阅主播
      operationId: subscribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "200":
          description: 订阅成功（幂等）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionItem"
        "400":
          description: mid 非法或 type 缺失/非法（合法取值：danmaku, dynamic, guard, recording）
  /api/b/subscription/{mid}:
    delete:
      summary: 取消订阅
      operationId: unsubscribe
      parameters:
        - $ref: "#/components/parameters/Mid"
        - name: type
          in: query
          required: true
          description: 订阅类型（danmaku / dynamic / guard / recording），缺失或非法返回 400。
          schema:
            type: string
            enum: [danmaku, dynamic, guard, recording]
      responses:
        "204":
          description: 取消成功
        "400":
          description: type 缺失或非法（合法取值：danmaku, dynamic, guard, recording）
        "404":
          description: 未订阅
  /api/b/user/{mid}:
    get:
      summary: 查询主播账号基本信息
      operationId: getAccountBasicInfo
      parameters:
        - $ref: "#/components/parameters/Mid"
      responses:
        "200":
          description: bilibili_account_basic_info 最新一条完整 Data
          content:
            application/json:
              schema:
                type: object
        "404":
          description: 未抓取过该主播
  /api/b/user/{mid}/space:
    get:
      summary: 分页查询空间动态
      description: 按动态 ID（dynamicId）倒序分页查询空间动态。B 站动态 ID 为单调递增的数值字符串，倒序即创建时间倒序，最新动态排在最前。
      operationId: listSpaceTimeline
      parameters:
        - $ref: "#/components/parameters/Mid"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StartedAt"
        - $ref: "#/components/parameters/EndedAt"
      responses:
        "200":
          description: 空间动态分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceTimelinePage"
  /api/b/live/{roomId}/state/all:
    get:
      summary: 分页查询直播状态历史
      operationId: listLiveStates
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StartedAt"
        - $ref: "#/components/parameters/EndedAt"
      responses:
        "200":
          description: 直播状态分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatePage"
  /api/b/live/{roomId}/state/current:
    get:
      summary: 查询当前直播状态
      operationId: getCurrentLiveState
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: created_at 最新一条 bilibili_live_status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveState"
        "404":
          description: 无记录
  /api/b/live/{roomId}/history:
    get:
      summary: 分页查询直播间历史场次
      description: 按开播时间（startDate）倒序分页查询 bilibili_live_session，最新开播的场次排在最前。
      operationId: listLiveSessionHistory
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StartedAt"
        - $ref: "#/components/parameters/EndedAt"
      responses:
        "200":
          description: 直播间历史场次分页（按 startDate 倒序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSessionHistoryPage"
  /api/b/live/{roomId}/event/subscribe:
    get:
      summary: 订阅直播间实时事件（SSE）
      description: >-
        订阅直播间实时事件，可传入一个或多个 type 仅推送匹配类型的事件，不传 type 推送全部类型。
        连接建立后立即发送一条 heartbeat 事件，之后每 10 秒发送一条（event: heartbeat，data 为空对象 {}）；
        heartbeat 为连接存活信号，不受 type 过滤影响，且不持久化、不出现在历史事件查询结果中。
      operationId: subscribeLiveEvents
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/EventType"
      responses:
        "200":
          description: text/event-stream，仅推送连接建立之后的事件；另含连接级 heartbeat 帧
          content:
            text/event-stream:
              schema:
                type: string
  /api/b/live/{roomId}/event/range:
    get:
      summary: 分页查询直播间事件
      description: 按发生时间（occurredAt）降序分页查询直播间事件，可按事件类型（type）与可选时间范围（startedAt/endedAt，含起止边界）筛选；支持按礼物金额下限（minPrice）筛选，仅作用于 gift/gift_v2 礼物类事件；startedAt 晚于 endedAt 或 minPrice 非法时返回 400。
      operationId: listLiveEventsRange
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/StartedAt"
        - $ref: "#/components/parameters/EndedAt"
        - $ref: "#/components/parameters/MinPrice"
      responses:
        "200":
          description: 直播间事件分页（按 occurredAt 降序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveEventPage"
        "400":
          description: 时间范围非法或 minPrice 非法（小于 0.01 或非数值）
  /api/b/live/{roomId}/event/search:
    get:
      summary: 搜索直播间文字事件（弹幕/SC）
      description: 在弹幕和醒目留言（SC）的纯文本内容、发送者用户名、粉丝牌名称中进行不区分大小写的子串匹配；纯数字关键词额外按发送者 UID 精确匹配，任一命中即返回。按发生时间（occurredAt）降序分页返回匹配的事件。搜索范围仅限弹幕（danmaku）和醒目留言（super_chat）类型。
      operationId: searchLiveEvents
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StringCriteria"
      responses:
        "200":
          description: 搜索结果分页（按 occurredAt 降序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveEventPage"
        "400":
          description: stringCriteria 非法（缺失、空串、纯空白、超过 200 字符）
  /api/b/backstage/subscription:
    get:
      summary: 聚合查询订阅主播列表（含库中主播昵称）
      description: 只读后台聚合接口：订阅列表与库中主播昵称（channel JSON 的 uName）内存 join，一次返回。未抓取到资料的主播 streamer 为 null。
      operationId: listBackstageSubscriptions
      responses:
        "200":
          description: 订阅聚合列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackstageSubscriptionList"
  /api/b/live/{roomId}/guard:
    get:
      summary: 查询直播间在舰用户列表
      description: 查询指定直播间在指定日期范围内的在舰用户列表，支持 any（范围内任意一天在舰即计入）和 all（范围内每一天都在舰才计入）两种统计口径。
      operationId: listOnboardGuardUids
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/StartedDate"
        - $ref: "#/components/parameters/EndedDate"
        - $ref: "#/components/parameters/OnboardMode"
      responses:
        "200":
          description: 在舰用户列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveGuardOnboardList"
        "400":
          description: 参数非法（缺失、格式错误、起晚于止、范围超 366 天、mode 非法）
  /api/b/backstage/cookie:
    get:
      summary: 聚合查询活跃 Cookie 列表（含对应帐号昵称）
      description: 只读后台聚合接口：活跃 Cookie 列表与易拉帐号昵称（CookieProbeJob 探测 nav 落库）内存 join，一次返回。尚未探测成功的 Cookie account 为 null。响应不含 Cookie 原文。
      operationId: listBackstageCookies
      responses:
        "200":
          description: Cookie 聚合列表（不含明文 Cookie）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackstageCookieList"
  /api/b/live/recording-status:
    get:
      summary: 聚合查询录播录制状态
      description: 读取 bilibili_subscriptions 中 recording 类型订阅，与录制状态（recording_status 集合）内存 join，返回每个订阅主播的录制状态。recording 服务不可达时仍返回订阅列表，状态退化为未知。
      operationId: listRecordingStatus
      responses:
        "200":
          description: 录制状态聚合列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatusList"
  /api/b/live/{roomId}/recordings:
    get:
      summary: 查询房间录播文件列表
      description: 代理 recording 服务，列出指定房间的录播文件名；无录播返回空数组。
      operationId: listRoomRecordings
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: 录播文件列表（含大小与创建时间；不含录制中文件）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingFileList"
        "502":
          description: recording 服务不可达
  /api/b/live/{roomId}/recordings/{fileName}:
    get:
      summary: 下载房间录播文件
      description: 代理 recording 服务，流式转发录播文件二进制内容；支持 Range 分段下载（206）与 If-Range 条件请求，越界区间返回 416；文件不存在返回 404，文件名非法或文件正在录制中返回 400。
      operationId: downloadRoomRecording
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: fileName
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/IfRange"
      responses:
        "200":
          description: 录播文件二进制内容（未携带 Range 或 Range 不被支持时返回完整文件）
          headers:
            Accept-Ranges:
              description: 服务端支持的分段单位，固定为 bytes
              schema:
                type: string
                example: bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: 单区间分段内容
          headers:
            Content-Range:
              description: 当前返回的字节区间及文件总大小，如 bytes 0-1023/20480
              schema:
                type: string
            Accept-Ranges:
              description: 服务端支持的分段单位，固定为 bytes
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          description: 请求区间越界（起始位置不小于文件大小）
          headers:
            Content-Range:
              description: 未满足的区间及文件总大小，如 bytes */20480
              schema:
                type: string
        "400":
          description: fileName 非法或文件正在录制中无法下载
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "404":
          description: 文件不存在
        "502":
          description: recording 服务不可达
  /api/b/live/{roomId}/live-stream/audio:
    get:
      summary: 代理实时音频流
      description: 代理 recording 服务的实时音频流，录制中返回 200 并持续输出 flv 封装音频；未在录制返回 404。
      operationId: proxyLiveAudio
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: 实时音频流（flv 封装）
          content:
            video/x-flv:
              schema:
                type: string
                format: binary
        "404":
          description: 该房间当前未在录制
        "502":
          description: recording 服务不可达
components:
  parameters:
    Mid:
      name: mid
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Range:
      name: Range
      in: header
      required: false
      description: 字节区间请求，如 bytes=0-1023；仅支持单区间，多区间请求回退为 200 返回完整文件
      schema:
        type: string
    IfRange:
      name: If-Range
      in: header
      required: false
      description: 条件 Range，校验失败（值与当前文件不匹配）时回退为 200 返回完整文件
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    EventType:
      name: type
      in: query
      required: false
      description: 事件类型筛选，可重复传入（如 type=danmaku&type=gift），多值为合集，不传返回全部类型。
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    StartedAt:
      name: startedAt
      in: query
      required: false
      description: 筛选起始时间（含边界，UTC，ISO 8601）。space 端点按动态发布时间（pub_ts）过滤且 pub_ts 缺失的记录被排除；state/all 按记录创建时间（createdAt）过滤；history 按开播时间（startDate）过滤；event/range 按事件发生时间（occurredAt）过滤。
      schema:
        type: string
        format: date-time
    EndedAt:
      name: endedAt
      in: query
      required: false
      description: 筛选结束时间（含边界，UTC，ISO 8601）。过滤语义同 startedAt；event/range 按事件发生时间（occurredAt）过滤。当 startedAt 晚于 endedAt 时返回 400。
      schema:
        type: string
        format: date-time
    MinPrice:
      name: minPrice
      in: query
      required: false
      description: 礼物金额下限（元），最小 0.01，含边界；仅作用于 gift/gift_v2 礼物类事件，其他类型不受影响；不传不限制；小于 0.01 或大于 9000000000000000 或非数值返回 400。
      schema:
        type: number
        minimum: 0.01
        maximum: 9000000000000000
    StringCriteria:
      name: stringCriteria
      in: query
      required: true
      description: 搜索关键词，在弹幕/SC 的纯文本、发送者用户名、粉丝牌名称中做不区分大小写子串匹配，任一命中即返回；纯数字关键词额外按发送者 UID 精确匹配；非空且非纯空白，最长 200 字符；缺失、为空、仅空白或超长返回 400。
      schema:
        type: string
        maxLength: 200
    StartedDate:
      name: startedAt
      in: query
      required: true
      description: 查询起始日期（yyyy-MM-dd，北京时间，含边界，起日 00:00 至止日 23:59:59 全天含边界）。
      schema:
        type: string
        format: date
    EndedDate:
      name: endedAt
      in: query
      required: true
      description: 查询结束日期（yyyy-MM-dd，北京时间，含边界，起日 00:00 至止日 23:59:59 全天含边界）。当 startedAt 晚于 endedAt 时返回 400。
      schema:
        type: string
        format: date
    OnboardMode:
      name: mode
      in: query
      required: false
      description: 统计口径：any=范围内任意一天在舰即计入（默认），all=范围内每一天都在舰才计入。
      schema:
        type: string
        enum: [any, all]
        default: any
  schemas:
    CookieAddRequest:
      type: object
      required: [cookie]
      properties:
        cookie:
          type: string
    CookieItem:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [active, offline]
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    CookieList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CookieItem"
    SubscribeRequest:
      type: object
      required: [mid, type]
      properties:
        mid:
          type: integer
          format: int64
        type:
          type: string
          enum: [danmaku, dynamic, guard, recording]
          description: 订阅类型（danmaku 弹幕 / dynamic 动态 / guard 舰长 / recording 录播），必填。
    SubscriptionItem:
      type: object
      properties:
        mid:
          type: integer
          format: int64
        type:
          type: string
          enum: [danmaku, dynamic, guard, recording]
          description: 订阅类型（danmaku 弹幕 / dynamic 动态 / guard 舰长 / recording 录播）
        subscribedAt:
          type: string
          format: date-time
    SubscriptionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionItem"
    BackstageStreamerRef:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: 主播昵称（从 channel JSON 的 uName 字段提取），缺失时为 null
    BackstageSubscriptionItem:
      type: object
      properties:
        mid:
          type: integer
          format: int64
        type:
          type: string
          enum: [danmaku, dynamic, guard, recording]
        subscribedAt:
          type: string
          format: date-time
        streamer:
          $ref: "#/components/schemas/BackstageStreamerRef"
    BackstageSubscriptionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackstageSubscriptionItem"
    BackstageAccountRef:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: 帐号昵称（CookieProbeJob 探测成功时由 nav 落库），缺失时为 null
    BackstageCookieItem:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [active, offline]
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        account:
          $ref: "#/components/schemas/BackstageAccountRef"
    BackstageCookieList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackstageCookieItem"
    LiveState:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        title:
          type: string
        liveStatus:
          type: boolean
        liveSessionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    LiveStatePage:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LiveState"
    LiveSession:
      type: object
      properties:
        liveId:
          type: string
        roomId:
          type: integer
          format: int64
        title:
          type: string
        coverUrl:
          type: string
          nullable: true
        parentArea:
          type: string
          nullable: true
        area:
          type: string
          nullable: true
        isFinish:
          type: boolean
        startDate:
          type: string
          format: date-time
        stopDate:
          type: string
          format: date-time
          nullable: true
        danmakuCount:
          type: integer
          format: int64
        totalIncome:
          type: number
          format: double
        watchCount:
          type: integer
          format: int64
        likeCount:
          type: integer
          format: int64
        payCount:
          type: integer
          format: int64
        maxOnlineCount:
          type: integer
          format: int64
    LiveSessionHistoryPage:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LiveSession"
    SpaceTimelineItem:
      type: object
      properties:
        mid:
          type: integer
          format: int64
        dynamicId:
          type: string
        fetchedAt:
