openapi: 3.1.0
info:
  title: Bilibili Live Crawler API
  version: 1.0.0
  description: B站主播数据抓取与订阅服务对外数据接口（统一前缀 /api/b）
servers:
  - url: /
paths:
  /api/b/cookie:
    get:
      summary: 查询活跃 Cookie 列表
      operationId: listActiveCookies
      responses:
        "200":
          description: 活跃 Cookie 列表（不含明文 Cookie）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieList"
    post:
      summary: 录入 Cookie
      operationId: addCookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CookieAddRequest"
      responses:
        "200":
          description: 录入成功（幂等）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieItem"
        "400":
          description: Cookie 为空
  /api/b/subscription:
    get:
      summary: 获取订阅主播列表
      operationId: listSubscriptions
      responses:
        "200":
          description: 订阅主播 mid 列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionList"
    post:
      summary: 订阅主播
      operationId: subscribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
      responses:
        "200":
          description: 订阅成功（幂等）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionItem"
        "400":
          description: mid 非法或 type 缺失/非法（合法取值：danmaku, dynamic, guard, recording）
  /api/b/subscription/{mid}:
    delete:
      summary: 取消订阅
      operationId: unsubscribe
      parameters:
        - $ref: "#/components/parameters/Mid"
        - name: type
          in: query
          required: true
          description: 订阅类型（danmaku / dynamic / guard / recording），缺失或非法返回 400。
          schema:
            type: string
            enum: [danmaku, dynamic, guard, recording]
      responses:
        "204":
          description: 取消成功
        "400":
          description: type 缺失或非法（合法取值：danmaku, dynamic, guard, recording）
        "404":
          description: 未订阅
  /api/b/user/{mid}:
    get:
      summary: 查询主播账号基本信息
      operationId: getAccountBasicInfo
      parameters:
        - $ref: "#/components/parameters/Mid"
      responses:
        "200":
          description: bilibili_account_basic_info 最新一条完整 Data
          content:
            application/json:
              schema:
                type: object
        "404":
          description: 未抓取过该主播
  /api/b/user/{mid}/space:
    get:
      summary: 分页查询空间动态
      description: 按动态 ID（dynamicId）倒序分页查询空间动态。B 站动态 ID 为单调递增的数值字符串，倒序即创建时间倒序，最新动态排在最前。
      operationId: listSpaceTimeline
      parameters:
        - $ref: "#/components/parameters/Mid"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StartedAt"
        - $ref: "#/components/parameters/EndedAt"
      responses:
        "200":
          description: 空间动态分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceTimelinePage"
  /api/b/live/{roomId}/state/all:
    get:
      summary: 分页查询直播状态历史
      operationId: listLiveStates
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StartedAt"
        - $ref: "#/components/parameters/EndedAt"
      responses:
        "200":
          description: 直播状态分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStatePage"
  /api/b/live/{roomId}/state/current:
    get:
      summary: 查询当前直播状态
      operationId: getCurrentLiveState
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: created_at 最新一条 bilibili_live_status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveState"
        "404":
          description: 无记录
  /api/b/live/{roomId}/history:
    get:
      summary: 分页查询直播间历史场次
      description: 按开播时间（startDate）倒序分页查询 bilibili_live_session，最新开播的场次排在最前。
      operationId: listLiveSessionHistory
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StartedAt"
        - $ref: "#/components/parameters/EndedAt"
      responses:
        "200":
          description: 直播间历史场次分页（按 startDate 倒序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSessionHistoryPage"
  /api/b/live/{roomId}/event/subscribe:
    get:
      summary: 订阅直播间实时事件（SSE）
      description: >-
        订阅直播间实时事件，可传入一个或多个 type 仅推送匹配类型的事件，不传 type 推送全部类型。
        连接建立后立即发送一条 heartbeat 事件，之后每 10 秒发送一条（event: heartbeat，data 为空对象 {}）；
        heartbeat 为连接存活信号，不受 type 过滤影响，且不持久化、不出现在历史事件查询结果中。
      operationId: subscribeLiveEvents
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/EventType"
      responses:
        "200":
          description: text/event-stream，仅推送连接建立之后的事件；另含连接级 heartbeat 帧
          content:
            text/event-stream:
              schema:
                type: string
  /api/b/live/{roomId}/event/range:
    get:
      summary: 分页查询直播间事件
      description: 按发生时间（occurredAt）降序分页查询直播间事件，可按事件类型（type）与可选时间范围（startedAt/endedAt，含起止边界）筛选；支持按礼物金额下限（minPrice）筛选，仅作用于 gift/gift_v2 礼物类事件；startedAt 晚于 endedAt 或 minPrice 非法时返回 400。
      operationId: listLiveEventsRange
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/StartedAt"
        - $ref: "#/components/parameters/EndedAt"
        - $ref: "#/components/parameters/MinPrice"
      responses:
        "200":
          description: 直播间事件分页（按 occurredAt 降序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveEventPage"
        "400":
          description: 时间范围非法或 minPrice 非法（小于 0.01 或非数值）
  /api/b/live/{roomId}/event/search:
    get:
      summary: 搜索直播间文字事件（弹幕/SC）
      description: 在弹幕和醒目留言（SC）的纯文本内容、发送者用户名、粉丝牌名称中进行不区分大小写的子串匹配；纯数字关键词额外按发送者 UID 精确匹配，任一命中即返回。按发生时间（occurredAt）降序分页返回匹配的事件。搜索范围仅限弹幕（danmaku）和醒目留言（super_chat）类型。
      operationId: searchLiveEvents
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/StringCriteria"
      responses:
        "200":
          description: 搜索结果分页（按 occurredAt 降序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveEventPage"
        "400":
          description: stringCriteria 非法（缺失、空串、纯空白、超过 200 字符）
  /api/b/backstage/subscription:
    get:
      summary: 聚合查询订阅主播列表（含库中主播昵称）
      description: 只读后台聚合接口：订阅列表与库中主播昵称（channel JSON 的 uName）内存 join，一次返回。未抓取到资料的主播 streamer 为 null。
      operationId: listBackstageSubscriptions
      responses:
        "200":
          description: 订阅聚合列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackstageSubscriptionList"
  /api/b/live/{roomId}/guard:
    get:
      summary: 查询直播间在舰用户列表
      description: 查询指定直播间在指定日期范围内的在舰用户列表，支持 any（范围内任意一天在舰即计入）和 all（范围内每一天都在舰才计入）两种统计口径。
      operationId: listOnboardGuardUids
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/StartedDate"
        - $ref: "#/components/parameters/EndedDate"
        - $ref: "#/components/parameters/OnboardMode"
      responses:
        "200":
          description: 在舰用户列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveGuardOnboardList"
        "400":
          description: 参数非法（缺失、格式错误、起晚于止、范围超 366 天、mode 非法）
  /api/b/backstage/cookie:
    get:
      summary: 聚合查询活跃 Cookie 列表（含对应帐号昵称）
      description: 只读后台聚合接口：活跃 Cookie 列表与易拉帐号昵称（CookieProbeJob 探测 nav 落库）内存 join，一次返回。尚未探测成功的 Cookie account 为 null。响应不含 Cookie 原文。
      operationId: listBackstageCookies
      responses:
        "200":
          description: Cookie 聚合列表（不含明文 Cookie）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackstageCookieList"
  /api/b/live/recording-status:
    get:
      summary: 聚合查询录播录制状态
      description: 读取 bilibili_subscriptions 中 recording 类型订阅，与录制状态（recording_status 集合）内存 join，返回每个订阅主播的录制状态。recording 服务不可达时仍返回订阅列表，状态退化为未知。
      operationId: listRecordingStatus
      responses:
        "200":
          description: 录制状态聚合列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatusList"
  /api/b/live/{roomId}/recordings:
    get:
      summary: 查询房间录播文件列表
      description: 代理 recording 服务，列出指定房间的录播文件名；无录播返回空数组。
      operationId: listRoomRecordings
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: 录播文件列表（按场次归档聚合，含文件元信息与所属场次信息；不含录制中文件；无录播返回空数组）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingFileList"
        "502":
          description: recording 服务不可达
  /api/b/live/{roomId}/recordings/{fileName}:
    get:
      summary: 下载房间录播文件
      description: 代理 recording 服务，流式转发录播文件二进制内容；支持 Range 分段下载（206）与 If-Range 条件请求，越界区间返回 416；文件不存在返回 404，文件名非法或文件正在录制中返回 400。
      operationId: downloadRoomRecording
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: fileName
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/IfRange"
      responses:
        "200":
          description: 录播文件二进制内容（未携带 Range 或 Range 不被支持时返回完整文件）
          headers:
            Accept-Ranges:
              description: 服务端支持的分段单位，固定为 bytes
              schema:
                type: string
                example: bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: 单区间分段内容
          headers:
            Content-Range:
              description: 当前返回的字节区间及文件总大小，如 bytes 0-1023/20480
              schema:
                type: string
            Accept-Ranges:
              description: 服务端支持的分段单位，固定为 bytes
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          description: 请求区间越界（起始位置不小于文件大小）
          headers:
            Content-Range:
              description: 未满足的区间及文件总大小，如 bytes */20480
              schema:
                type: string
        "400":
          description: fileName 非法或文件正在录制中无法下载
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "404":
          description: 文件不存在
        "502":
          description: recording 服务不可达
  /api/b/live/{roomId}/recordings/{fileName}/audio:
    get:
      summary: 代理录播音频片段（试听）
      description: >-
        代理 recording 服务的音频片段端点，query 原样透传；上游不支持 Range 分段，本代理不透传 Range 语义，
        成功响应不设置 Content-Disposition（供 <audio> 内联播放）。
      operationId: proxyRoomRecordingAudioClip
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: fileName
          in: path
          required: true
          schema:
            type: string
        - name: startMs
          in: query
          required: true
          description: 片段起点（整场录播文件时间轴毫秒，>= 0）
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: endMs
          in: query
          required: true
          description: 片段终点（毫秒，必须大于 startMs；区间长度上限见 recording 服务配置）
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 片段音频（透传上游 Content-Type 与 Cache-Control）
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
        "400":
          description: fileName 非法 / 区间参数非法 / 区间超上限 / 文件正在录制中（透传上游响应体）
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "404":
          description: 文件不存在
        "502":
          description: recording 服务不可达
  /api/b/live/{roomId}/live-stream/audio:
    get:
      summary: 代理实时音频流
      description: 代理 recording 服务的实时音频流，录制中返回 200 并持续输出 flv 封装音频；未在录制返回 404。
      operationId: proxyLiveAudio
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: 实时音频流（flv 封装）
          content:
            video/x-flv:
              schema:
                type: string
                format: binary
        "404":
          description: 该房间当前未在录制
        "502":
          description: recording 服务不可达
  /api/recordings:
    get:
      summary: 查询录播场次归档列表（代理转写服务）
      description: 代理 recording-transcript-api，供「识别设置」的场次选择器使用，按 StartedAt 倒序返回。
      operationId: listTranscriptRecordings
      parameters:
        - $ref: "#/components/parameters/TranscriptRoomIdQuery"
        - $ref: "#/components/parameters/TranscriptLimit"
        - $ref: "#/components/parameters/TranscriptBefore"
      responses:
        "200":
          description: 录播场次归档列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptRecordingList"
        "502":
          description: transcript 服务不可达
  /api/transcripts/enqueue:
    post:
      summary: 手动发起转写任务（代理转写服务）
      operationId: enqueueTranscriptTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingTranscriptEnqueueRequest"
      responses:
        "200":
          description: 任务已创建（或幂等返回已有任务）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptEnqueueResponse"
        "400":
          description: 录播尚未结束（EndedAt 为空），不满足手动发起转写的前置条件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "404":
          description: 录播或模型不存在，或模型已被禁用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "409":
          description: 同录播 + 同模型已存在任务，返回已有 taskId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptEnqueueResponse"
        "502":
          description: transcript 服务不可达
  /api/transcripts/task:
    get:
      summary: 查询转写任务列表（代理转写服务）
      description: 默认按创建时间倒序；进行中优先由 status 过滤支持。
      operationId: listTranscriptTasks
      parameters:
        - $ref: "#/components/parameters/TranscriptRecordingIdQuery"
        - $ref: "#/components/parameters/TranscriptRoomIdQuery"
        - $ref: "#/components/parameters/TranscriptTaskStatusQuery"
        - $ref: "#/components/parameters/TranscriptLimit"
      responses:
        "200":
          description: 转写任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptTaskList"
        "502":
          description: transcript 服务不可达
  /api/transcripts/task/{taskId}:
    get:
      summary: 查询转写任务详情与全量 segments（代理转写服务）
      operationId: getTranscriptTask
      parameters:
        - $ref: "#/components/parameters/TranscriptTaskId"
      responses:
        "200":
          description: 任务详情（segments 按 start 升序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptTaskDetail"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "502":
          description: transcript 服务不可达
  /api/transcripts/task/{taskId}/offset:
    put:
      summary: 设置任务播放偏移（代理转写服务）
      description: >-
        代理 recording-transcript-api 的任务播放偏移端点，body 原样透传；任务级播放偏移（毫秒，可正可负），
        统一作用于任务详情 segments、SSE 实时推送与字幕导出的展示时间。
      operationId: updateTranscriptTaskOffset
      parameters:
        - $ref: "#/components/parameters/TranscriptTaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingTranscriptTaskOffsetUpdateRequest"
      responses:
        "200":
          description: 设置成功，返回更新后的任务（含 offsetMs）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptTask"
        "400":
          description: offsetMs 缺失或超出 ±86400000（±24h），错误信息 offsetMs out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "404":
          description: 任务不存在（含 taskId 非法）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "502":
          description: transcript 服务不可达
  /api/transcripts/task/{taskId}/subtitle:
    get:
      summary: 代理下载字幕文件（SRT/ASS）
      description: 代理 recording-transcript-api 的字幕下载端点，query 原样透传；200 透传 Content-Type 与 Content-Disposition。
      operationId: proxyTranscriptSubtitle
      parameters:
        - $ref: "#/components/parameters/TranscriptTaskId"
        - name: format
          in: query
          required: false
          description: 字幕格式，srt（默认）| ass；其他取值返回 400
          schema:
            type: string
            enum: [srt, ass]
            default: srt
      responses:
        "200":
          description: 字幕文件内容（透传 Content-Type 与 Content-Disposition）
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/x-subrip:
              schema:
                type: string
            text/x-ass:
              schema:
                type: string
        "400":
          description: format 不支持（非 srt/ass）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "502":
          description: transcript 服务不可达
  /api/transcripts/task/{taskId}/retry:
    post:
      summary: 重试失败任务（代理转写服务）
      description: 仅 FAILED 可重试；将 status 置为 RUNNING（不持锁，由扫描器按「RUNNING 无锁」规则接管，从 position 断点续跑），清空 error。
      operationId: retryTranscriptTask
      parameters:
        - $ref: "#/components/parameters/TranscriptTaskId"
      responses:
        "200":
          description: 重试成功，返回更新后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptTask"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "409":
          description: 任务状态不允许重试（非 FAILED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "502":
          description: transcript 服务不可达
  /api/transcripts/task/{taskId}/sse:
    get:
      summary: 订阅任务实时 segments（代理转写服务，SSE）
      description: 代理 transcript 服务的 text/event-stream；先订阅 Redis 实时推送，再 replay 已入库 segments，以 start 去重；15s 心跳；任务终态（DONE/FAILED）后推送 done 事件并关闭。
      operationId: streamTranscriptSegments
      parameters:
        - $ref: "#/components/parameters/TranscriptTaskId"
      responses:
        "200":
          description: text/event-stream，先订阅实时推送再 replay 已入库 segments，以 start 去重，终态推送 done
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "502":
          description: transcript 服务不可达
  /api/transcripts/settings:
    get:
      summary: 查询自动识别设置全量列表（代理转写服务）
      operationId: listTranscriptSettings
      responses:
        "200":
          description: 自动识别设置全量列表（关联主播资料补 anchorName）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptSettingsList"
        "502":
          description: transcript 服务不可达
  /api/transcripts/candidate-rooms:
    get:
      summary: 查询候选主播列表（代理转写服务）
      description: 从 recordings 聚合 distinct roomId 与最新 mid，关联主播资料补 anchorName，按 roomId 升序返回。
      operationId: listTranscriptCandidateRooms
      responses:
        "200":
          description: 候选主播列表（roomId 升序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptCandidateRoomList"
        "502":
          description: transcript 服务不可达
  /api/recordings/{roomId}/transcripts:
    get:
      summary: 按主播查询录播场次及转写任务（代理转写服务）
      operationId: getRoomTranscripts
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: 该主播的录播场次及各场次 transcript 任务（含当前自动识别开关状态）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptRoomView"
        "502":
          description: transcript 服务不可达
  /api/recordings/{roomId}/transcripts/settings:
    post:
      summary: 设置指定主播的自动识别开关（代理转写服务）
      operationId: updateTranscriptSettings
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingTranscriptSettingsUpdateRequest"
      responses:
        "200":
          description: 设置成功（upsert）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptSettingsUpdateResponse"
        "400":
          description: >-
            参数非法：请求体缺失；或 enable=true 时缺少 modelId、modelId 格式非法、
            指向不存在或未启用的模型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "502":
          description: transcript 服务不可达
    delete:
      summary: 删除指定主播的自动识别设置（代理转写服务）
      description: 物理删除 transcript_auto_enqueue 记录；不影响该主播已存在的转写任务。
      operationId: deleteTranscriptSettings
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: 删除成功
        "404":
          description: 该主播的自动识别设置不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "502":
          description: transcript 服务不可达
  /api/transcripts/models:
    get:
      summary: 查询转写模型列表（代理转写服务）
      operationId: listTranscriptModels
      responses:
        "200":
          description: 模型列表（不回传 apiKey）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptModelList"
        "502":
          description: transcript 服务不可达
    post:
      summary: 添加转写模型（代理转写服务）
      operationId: createTranscriptModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingTranscriptModelCreateRequest"
      responses:
        "200":
          description: 创建成功（不回传 apiKey）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptModel"
        "400":
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "502":
          description: transcript 服务不可达
  /api/transcripts/models/{modelId}:
    put:
      summary: 更新转写模型（代理转写服务）
      description: 更新启用/禁用、识别模型、最大并发、API Key（可选，不传则不改）；被禁用模型进行中的任务继续跑完。
      operationId: updateTranscriptModel
      parameters:
        - $ref: "#/components/parameters/TranscriptModelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingTranscriptModelUpdateRequest"
      responses:
        "200":
          description: 更新成功（不回传 apiKey）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptModel"
        "400":
          description: 参数非法（请求体缺失）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "404":
          description: 模型不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingTranscriptErrorResponse"
        "502":
          description: transcript 服务不可达
components:
  parameters:
    Mid:
      name: mid
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Range:
      name: Range
      in: header
      required: false
      description: 字节区间请求，如 bytes=0-1023；仅支持单区间，多区间请求回退为 200 返回完整文件
      schema:
        type: string
    IfRange:
      name: If-Range
      in: header
      required: false
      description: 条件 Range，校验失败（值与当前文件不匹配）时回退为 200 返回完整文件
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    EventType:
      name: type
      in: query
      required: false
      description: 事件类型筛选，可重复传入（如 type=danmaku&type=gift），多值为合集，不传返回全部类型。
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    StartedAt:
      name: startedAt
      in: query
      required: false
      description: 筛选起始时间（含边界，UTC，ISO 8601）。space 端点按动态发布时间（pub_ts）过滤且 pub_ts 缺失的记录被排除；state/all 按记录创建时间（createdAt）过滤；history 按开播时间（startDate）过滤；event/range 按事件发生时间（occurredAt）过滤。
      schema:
        type: string
        format: date-time
    EndedAt:
      name: endedAt
      in: query
      required: false
      description: 筛选结束时间（含边界，UTC，ISO 8601）。过滤语义同 startedAt；event/range 按事件发生时间（occurredAt）过滤。当 startedAt 晚于 endedAt 时返回 400。
      schema:
        type: string
        format: date-time
    MinPrice:
      name: minPrice
      in: query
      required: false
      description: 礼物金额下限（元），最小 0.01，含边界；仅作用于 gift/gift_v2 礼物类事件，其他类型不受影响；不传不限制；小于 0.01 或大于 9000000000000000 或非数值返回 400。
      schema:
        type: number
        minimum: 0.01
        maximum: 9000000000000000
    StringCriteria:
      name: stringCriteria
      in: query
      required: true
      description: 搜索关键词，在弹幕/SC 的纯文本、发送者用户名、粉丝牌名称中做不区分大小写子串匹配，任一命中即返回；纯数字关键词额外按发送者 UID 精确匹配；非空且非纯空白，最长 200 字符；缺失、为空、仅空白或超长返回 400。
      schema:
        type: string
        maxLength: 200
    StartedDate:
      name: startedAt
      in: query
      required: true
      description: 查询起始日期（yyyy-MM-dd，北京时间，含边界，起日 00:00 至止日 23:59:59 全天含边界）。
      schema:
        type: string
        format: date
    EndedDate:
      name: endedAt
      in: query
      required: true
      description: 查询结束日期（yyyy-MM-dd，北京时间，含边界，起日 00:00 至止日 23:59:59 全天含边界）。当 startedAt 晚于 endedAt 时返回 400。
      schema:
        type: string
        format: date
    OnboardMode:
      name: mode
      in: query
      required: false
      description: 统计口径：any=范围内任意一天在舰即计入（默认），all=范围内每一天都在舰才计入。
      schema:
        type: string
        enum: [any, all]
        default: any
    TranscriptRoomIdQuery:
      name: roomId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    TranscriptRecordingIdQuery:
      name: recordingId
      in: query
      required: false
      description: 按录播场次过滤
      schema:
        type: string
    TranscriptTaskStatusQuery:
      name: status
      in: query
      required: false
      description: 按任务状态过滤
      schema:
        $ref: "#/components/schemas/RecordingTranscriptTaskStatus"
    TranscriptTaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    TranscriptModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
    TranscriptLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 50
    TranscriptBefore:
      name: before
      in: query
      required: false
      description: 分页游标（StartedAt 倒序），传入后返回早于该时刻的记录
      schema:
        type: string
        format: date-time
  schemas:
    CookieAddRequest:
      type: object
      required: [cookie]
      properties:
        cookie:
          type: string
    CookieItem:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [active, offline]
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
    CookieList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CookieItem"
    SubscribeRequest:
      type: object
      required: [mid, type]
      properties:
        mid:
          type: integer
          format: int64
        type:
          type: string
          enum: [danmaku, dynamic, guard, recording]
          description: 订阅类型（danmaku 弹幕 / dynamic 动态 / guard 舰长 / recording 录播），必填。
    SubscriptionItem:
      type: object
      properties:
        mid:
          type: integer
          format: int64
        type:
          type: string
          enum: [danmaku, dynamic, guard, recording]
          description: 订阅类型（danmaku 弹幕 / dynamic 动态 / guard 舰长 / recording 录播）
        subscribedAt:
          type: string
          format: date-time
    SubscriptionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionItem"
    BackstageStreamerRef:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: 主播昵称（从 channel JSON 的 uName 字段提取），缺失时为 null
    BackstageSubscriptionItem:
      type: object
      properties:
        mid:
          type: integer
          format: int64
        type:
          type: string
          enum: [danmaku, dynamic, guard, recording]
        subscribedAt:
          type: string
          format: date-time
        streamer:
          $ref: "#/components/schemas/BackstageStreamerRef"
    BackstageSubscriptionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackstageSubscriptionItem"
    BackstageAccountRef:
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: 帐号昵称（CookieProbeJob 探测成功时由 nav 落库），缺失时为 null
    BackstageCookieItem:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [active, offline]
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        account:
          $ref: "#/components/schemas/BackstageAccountRef"
    BackstageCookieList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BackstageCookieItem"
    LiveState:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        title:
          type: string
        liveStatus:
          type: boolean
        liveSessionId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    LiveStatePage:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LiveState"
    LiveSession:
      type: object
      properties:
        liveId:
          type: string
        roomId:
          type: integer
          format: int64
        title:
          type: string
        coverUrl:
          type: string
          nullable: true
        parentArea:
          type: string
          nullable: true
        area:
          type: string
          nullable: true
        isFinish:
          type: boolean
        startDate:
          type: string
          format: date-time
        stopDate:
          type: string
          format: date-time
          nullable: true
        danmakuCount:
          type: integer
          format: int64
        totalIncome:
          type: number
          format: double
        watchCount:
          type: integer
          format: int64
        likeCount:
          type: integer
          format: int64
        payCount:
          type: integer
          format: int64
        maxOnlineCount:
          type: integer
          format: int64
    LiveSessionHistoryPage:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LiveSession"
    SpaceTimelineItem:
      type: object
      properties:
        mid:
          type: integer
          format: int64
        dynamicId:
          type: string
        fetchedAt:
          type: string
          format: date-time
        data:
          type: object
    SpaceTimelinePage:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpaceTimelineItem"
    LiveEvent:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        type:
          type: string
        occurredAt:
          type: string
          format: date-time
        liveSessionId:
          type: string
          nullable: true
        payload:
          type: object
    LiveEventPage:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LiveEvent"
    LiveGuardOnboardItem:
      type: object
      properties:
        uid:
          type: integer
          format: int64
        userName:
          type: string
        guardLevel:
          type: integer
          format: int32
        medalName:
          type: string
          nullable: true
        medalLevel:
          type: integer
          format: int32
    LiveGuardOnboardList:
      type: object
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LiveGuardOnboardItem"
    RecordingStatusItem:
      type: object
      properties:
        mid:
          type: integer
          format: int64
        roomId:
          type: integer
          format: int64
          nullable: true
        state:
          type: string
          enum: [not_live, recording, error, unknown]
          description: 录制状态（unknown 表示 recording 服务不可达或尚无状态记录）
        hostName:
          type: string
          nullable: true
        sessionTitle:
          type: string
          nullable: true
        files:
          type: array
          items:
            type: string
        error:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        streamer:
          $ref: "#/components/schemas/BackstageStreamerRef"
    RecordingStatusList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecordingStatusItem"
    RecordingFileList:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/RecordingFile"
    RecordingFile:
      type: object
      required: [name, size, createdAt, info]
      properties:
        name:
          type: string
          description: 录播文件名（平文件名）
        size:
          type: integer
          format: int64
          description: 文件大小（字节）
        createdAt:
          type: string
          format: date-time
          description: 文件创建时间（UTC）
        info:
          $ref: "#/components/schemas/RecordingSessionInfo"
    RecordingSessionInfo:
      type: object
      required: [recordingId, title, mid, startedAt, endedAt]
      properties:
        recordingId:
          type: string
          description: 所属场次归档记录标识
        title:
          type: string
          description: 场次标题（直播标题）
        mid:
          type: integer
          format: int64
          description: 主播 mid
        startedAt:
          type: string
          format: date-time
          description: 场次开始（录制开始）时间（UTC）
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: 场次结束时间（UTC）；未正常收尾为 null
    RecordingTranscriptErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    RecordingTranscriptEnqueueRequest:
      type: object
      required: [recordingId, modelId]
      properties:
        recordingId:
          type: string
        modelId:
          type: string
    RecordingTranscriptEnqueueResponse:
      type: object
      required: [taskId, status]
      properties:
        taskId:
          type: string
        status:
          type: string
          description: 新建任务固定为 PENDING
          example: PENDING
    RecordingTranscriptTaskStatus:
      type: string
      enum: [PENDING, RUNNING, DONE, FAILED]
    RecordingTranscriptTaskMode:
      type: string
      enum: [live, file]
      description: live=开播自动创建，实时音频流为源；file=手动发起，录播文件为源
    RecordingTranscriptTaskSource:
      type: string
      enum: [auto, manual]
    RecordingTranscriptTaskType:
      type: string
      enum: [recording]
      description: 音源类型，当前固定 recording（预留扩展）
    RecordingTranscriptTask:
      type: object
      properties:
        id:
          type: string
        recordingId:
          type: string
        roomId:
          type: integer
          format: int64
        title:
          type: string
          nullable: true
        file:
          type: string
          nullable: true
          description: 识别所用录播文件（优先 RAW，缺失回退首个）
        modelId:
          type: string
        modelName:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/RecordingTranscriptTaskType"
        mode:
          $ref: "#/components/schemas/RecordingTranscriptTaskMode"
        source:
          $ref: "#/components/schemas/RecordingTranscriptTaskSource"
        status:
          $ref: "#/components/schemas/RecordingTranscriptTaskStatus"
        position:
          type: integer
          format: int64
          description: 断点位置（毫秒），始终为句尾
        offsetMs:
          type: integer
          format: int64
          default: 0
          description: >-
            任务播放偏移（毫秒，可正可负，范围 ±86400000），详情 segments、SSE 与字幕导出
            统一在展示时间上叠加该偏移；历史任务缺省为 0
        error:
          type: string
          nullable: true
          description: FAILED 原因
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecordingTranscriptTaskList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecordingTranscriptTask"
    RecordingTranscriptSegment:
      type: object
      required: [start, end, text]
      properties:
        start:
          type: integer
          format: int64
          description: 含任务播放偏移的展示时间（毫秒）= 整场录播时间轴上的句首（含续跑 offset）+ 任务播放偏移
        end:
          type: integer
          format: int64
          description: 含任务播放偏移的展示时间（毫秒）= 整场录播时间轴上的句尾 + 任务播放偏移
        text:
          type: string
    RecordingTranscriptTaskDetail:
      type: object
      required: [task, segments]
      properties:
        task:
          $ref: "#/components/schemas/RecordingTranscriptTask"
        segments:
          type: array
          description: 全量 segments（按 start 升序）
          items:
            $ref: "#/components/schemas/RecordingTranscriptSegment"
    RecordingTranscriptSettingsItem:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        mid:
          type: integer
          format: int64
          nullable: true
        anchorName:
          type: string
          nullable: true
        enabled:
