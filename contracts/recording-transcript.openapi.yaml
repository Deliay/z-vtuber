openapi: 3.1.0
info:
  title: Recording Transcript Service API
  version: 1.0.0
  description: 直播录播语音转写服务 API（录播场次归档、任务队列、流式识别任务与实时 segments、自动识别设置与模型管理）
servers:
  - url: /
paths:
  /health:
    get:
      summary: 健康检查
      operationId: health
      responses:
        "200":
          description: 服务存活且 MongoDB 可达
          content:
            text/plain:
              schema:
                type: string
  /api/recordings:
    get:
      summary: 查询录播场次归档列表
      description: >-
        供「识别设置」的场次选择器使用，按 StartedAt 倒序返回。
        以 recording 服务磁盘数据为准：「files 中所有文件均不存在」的空场次被过滤；
        部分文件存在时返回的 files 收缩为实际存在的文件子集，size 为存在文件字节数之和。
        recording 服务不可达时降级返回未过滤原始列表（size=null）。
      operationId: listRecordings
      parameters:
        - $ref: "#/components/parameters/RoomIdQuery"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Before"
      responses:
        "200":
          description: 录播场次归档列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingList"
  /api/transcripts/candidate-rooms:
    get:
      summary: 查询候选主播列表
      description: 供自动识别设置的「添加」选择器使用；从 recordings 聚合 distinct roomId 与各房间最新 mid，关联主播资料补 anchorName，按 roomId 升序返回。
      operationId: listTranscriptCandidateRooms
      responses:
        "200":
          description: 候选主播列表（roomId 升序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateRoomList"
  /api/transcripts/enqueue:
    post:
      summary: 手动发起转写任务
      operationId: enqueueTranscript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueRequest"
      responses:
        "200":
          description: 任务已创建（或幂等返回已有任务）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueResponse"
        "400":
          description: 录播尚未结束（EndedAt 为空），不满足手动发起转写的前置条件
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 录播或模型不存在，或模型已被禁用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 同录播 + 同模型已存在任务，返回已有 taskId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueResponse"
  /api/transcripts/task:
    get:
      summary: 查询转写任务列表
      description: 默认按创建时间倒序；进行中优先由 status 过滤支持。
      operationId: listTranscriptTasks
      parameters:
        - $ref: "#/components/parameters/RecordingIdQuery"
        - $ref: "#/components/parameters/RoomIdQuery"
        - $ref: "#/components/parameters/TaskStatusQuery"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 转写任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptTaskList"
  /api/transcripts/task/{taskId}:
    get:
      summary: 查询转写任务详情与全量 segments
      operationId: getTranscriptTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 任务详情（segments 按 start 升序）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptTaskDetail"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/transcripts/task/{taskId}/retry:
    post:
      summary: 重试失败任务
      description: 仅 FAILED 可重试；将 status 置为 RUNNING（不持锁，由扫描器按「RUNNING 无锁」规则接管，从 position 断点续跑），清空 error。
      operationId: retryTranscriptTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 重试成功，返回更新后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptTask"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 任务状态不允许重试（非 FAILED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/transcripts/task/{taskId}/sse:
    get:
      summary: 订阅任务实时 segments（SSE）
      description: 先订阅 Redis 实时推送，再 replay 已入库 segments，以 start 去重；15s 心跳；任务终态（DONE/FAILED）后推送 done 事件并关闭。
      operationId: streamTranscriptSegments
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: text/event-stream，先订阅实时推送再 replay 已入库 segments，以 start 去重，终态推送 done
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/transcripts/settings:
    get:
      summary: 查询自动识别设置全量列表
      operationId: listTranscriptSettings
      responses:
        "200":
          description: 自动识别设置全量列表（关联主播资料补 anchorName）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptSettingsList"
  /api/recordings/{roomId}/transcripts:
    get:
      summary: 按主播查询录播场次及转写任务
      description: >-
        该主播的录播场次及各场次 transcript 任务（含当前自动识别开关状态）。
        与 GET /api/recordings 一致：所有文件均不存在的空场次被过滤；recording 服务不可达时降级返回未过滤列表。
      operationId: getRoomTranscripts
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: 该主播的录播场次及各场次 transcript 任务（含当前自动识别开关状态）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomTranscriptView"
  /api/recordings/{roomId}/transcripts/settings:
    post:
      summary: 设置指定主播的自动识别开关
      operationId: updateTranscriptSettings
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptSettingsUpdateRequest"
      responses:
        "200":
          description: 设置成功（upsert）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptSettingsUpdateResponse"
        "400":
          description: >-
            参数非法：请求体缺失；或 enable=true 时缺少 modelId、modelId 格式非法、
            指向不存在或未启用的模型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: 删除指定主播的自动识别设置
      description: 物理删除 transcript_auto_enqueue 记录；不影响该主播已存在的转写任务。
      operationId: deleteTranscriptSettings
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: 删除成功
        "404":
          description: 该主播的自动识别设置不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/transcripts/models:
    get:
      summary: 查询转写模型列表
      operationId: listTranscriptModels
      responses:
        "200":
          description: 模型列表（不回传 apiKey）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptModelList"
    post:
      summary: 添加转写模型
      operationId: createTranscriptModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptModelCreateRequest"
      responses:
        "200":
          description: 创建成功（不回传 apiKey）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptModel"
        "400":
          description: 参数非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/transcripts/models/{modelId}:
    put:
      summary: 更新转写模型
      description: 更新启用/禁用、识别模型、最大并发、API Key（可选，不传则不改）；被禁用模型进行中的任务继续跑完。
      operationId: updateTranscriptModel
      parameters:
        - $ref: "#/components/parameters/ModelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptModelUpdateRequest"
      responses:
        "200":
          description: 更新成功（不回传 apiKey）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptModel"
        "400":
          description: 参数非法（请求体缺失）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 模型不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    RoomIdQuery:
      name: roomId
      in: query
      required: false
      schema:
        type: integer
        format: int64
    RecordingIdQuery:
      name: recordingId
      in: query
      required: false
      description: 按录播场次过滤
      schema:
        type: string
    TaskStatusQuery:
      name: status
      in: query
      required: false
      description: 按任务状态过滤
      schema:
        $ref: "#/components/schemas/TranscriptTaskStatus"
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 50
    Before:
      name: before
      in: query
      required: false
      description: 分页游标（StartedAt 倒序），传入后返回早于该时刻的记录
      schema:
        type: string
        format: date-time
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    EnqueueRequest:
      type: object
      required: [recordingId, modelId]
      properties:
        recordingId:
          type: string
        modelId:
          type: string
    EnqueueResponse:
      type: object
      required: [taskId, status]
      properties:
        taskId:
          type: string
        status:
          type: string
          description: 新建任务固定为 PENDING
          example: PENDING
    TranscriptTaskStatus:
      type: string
      enum: [PENDING, RUNNING, DONE, FAILED]
    TranscriptTaskMode:
      type: string
      enum: [live, file]
      description: live=开播自动创建，实时音频流为源；file=手动发起，录播文件为源
    TranscriptTaskSource:
      type: string
      enum: [auto, manual]
    TranscriptTaskType:
      type: string
      enum: [recording]
      description: 音源类型，当前固定 recording（预留扩展）
    TranscriptTask:
      type: object
      properties:
        id:
          type: string
        recordingId:
          type: string
        roomId:
          type: integer
          format: int64
        title:
          type: string
          nullable: true
        file:
          type: string
          nullable: true
          description: 识别所用录播文件（优先 RAW，缺失回退首个）
        modelId:
          type: string
        modelName:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/TranscriptTaskType"
        mode:
          $ref: "#/components/schemas/TranscriptTaskMode"
        source:
          $ref: "#/components/schemas/TranscriptTaskSource"
        status:
          $ref: "#/components/schemas/TranscriptTaskStatus"
        position:
          type: integer
          format: int64
          description: 断点位置（毫秒），始终为句尾
        error:
          type: string
          nullable: true
          description: FAILED 原因
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TranscriptTaskList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptTask"
    TranscriptSegment:
      type: object
      required: [start, end, text]
      properties:
        start:
          type: integer
          format: int64
          description: 整场录播时间轴上的句首（毫秒，含续跑 offset）
        end:
          type: integer
          format: int64
          description: 整场录播时间轴上的句尾（毫秒）
        text:
          type: string
    TranscriptTaskDetail:
      type: object
      required: [task, segments]
      properties:
        task:
          $ref: "#/components/schemas/TranscriptTask"
        segments:
          type: array
          description: 全量 segments（按 start 升序）
          items:
            $ref: "#/components/schemas/TranscriptSegment"
    TranscriptSettingsItem:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        mid:
          type: integer
          format: int64
          nullable: true
        anchorName:
          type: string
          nullable: true
        enabled:
          type: boolean
        modelId:
          type: string
          nullable: true
          description: 绑定的转写模型 ID；为空表示未绑定（待完善），自动转写不生效
        modelName:
          type: string
          nullable: true
          description: 绑定模型名称；未绑定或模型已删除时为空
    TranscriptSettingsList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSettingsItem"
    TranscriptSettingsUpdateRequest:
      type: object
      required: [enable]
      properties:
        enable:
          type: boolean
        modelId:
          type: string
          description: >-
            绑定的转写模型 ID；enable=true 时必填且须指向已启用模型，否则 400；
            enable=false 时可省略

    TranscriptSettingsUpdateResponse:
      type: object
      required: [roomId, enabled]
      properties:
        roomId:
          type: integer
          format: int64
        enabled:
          type: boolean
    RecordingItem:
      type: object
      properties:
        id:
          type: string
        roomId:
          type: integer
          format: int64
        mid:
          type: integer
          format: int64
        anchorName:
          type: string
          nullable: true
          description: 关联主播资料补全的名称；资料缺失为 null
        title:
          type: string
          nullable: true
        files:
          type: array
          items:
            type: string
        size:
          type: integer
          format: int64
          nullable: true
          description: 磁盘实际存在文件的总字节数；recording 服务不可达时为 null
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
    RecordingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecordingItem"
    CandidateRoom:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        mid:
          type: integer
          format: int64
        anchorName:
          type: string
          nullable: true
    CandidateRoomList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CandidateRoom"
    RoomTranscriptTaskRef:
      type: object
      properties:
        taskId:
          type: string
        modelId:
          type: string
        modelName:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/TranscriptTaskStatus"
        position:
          type: integer
          format: int64
        source:
          $ref: "#/components/schemas/TranscriptTaskSource"
        updatedAt:
          type: string
          format: date-time
    RoomTranscriptRecording:
      type: object
      properties:
        recordingId:
          type: string
        title:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/RoomTranscriptTaskRef"
    RoomTranscriptView:
      type: object
      required: [roomId, autoEnqueueEnabled, items]
      properties:
        roomId:
          type: integer
          format: int64
        autoEnqueueEnabled:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/RoomTranscriptRecording"
    TranscriptModel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
          enum: [ali-fun-asr]
        type:
          type: string
          enum: [streaming]
        model:
          type: string
          description: 实际发给服务商的模型 ID，如 fun-asr-realtime
        enabled:
          type: boolean
        maxConcurrency:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
    TranscriptModelList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptModel"
    TranscriptModelCreateRequest:
      type: object
      required: [name, provider, type, apiKey, model]
      properties:
        name:
          type: string
        provider:
          type: string
          enum: [ali-fun-asr]
        type:
          type: string
          enum: [streaming]
        apiKey:
          type: string
        model:
          type: string
          description: 实际发给服务商的模型 ID，如 fun-asr-realtime
        enabled:
          type: boolean
          default: true
        maxConcurrency:
          type: integer
          format: int32
          default: 1
    TranscriptModelUpdateRequest:
      type: object
      properties:
        enabled:
          type: boolean
        model:
          type: string
          description: 实际发给服务商的模型 ID
        maxConcurrency:
          type: integer
          format: int32
        apiKey:
          type: string
          description: 可选，不传则不改
