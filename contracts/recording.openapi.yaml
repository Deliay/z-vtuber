openapi: 3.1.0
info:
  title: Recording Service API
  version: 1.0.0
  description: B站直播录播服务 API（开播自动录制、录播文件管理与实时音频流）
servers:
  - url: /
paths:
  /health:
    get:
      summary: 健康检查
      operationId: health
      responses:
        "200":
          description: 服务存活且 MongoDB 可达
          content:
            text/plain:
              schema:
                type: string
  /api/recording/status:
    get:
      summary: 查询全部录制状态
      operationId: listRecordingStatus
      responses:
        "200":
          description: 当前全部录制状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingStatusList"
  /api/{roomId}/stream/audio:
    get:
      summary: 实时音频流
      description: 录制中返回 200 并持续输出 flv 封装的音频数据；未在录制返回 404。
      operationId: streamAudio
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: 实时音频流（flv 封装）
          content:
            video/x-flv:
              schema:
                type: string
                format: binary
        "404":
          description: 该房间当前未在录制
  /api/{roomId}/recordings:
    get:
      summary: 列出房间录播文件
      operationId: listRecordings
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: 录播文件列表（按场次归档聚合，含文件元信息与所属场次信息；不含录制中文件；无录播返回空数组）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingFileList"
  /api/recordings/file-stats:
    post:
      summary: 批量查询录播文件磁盘状态
      description: >-
        磁盘权威端点：按 {StorageDir}/{roomId}/{fileName} 逐个判定文件是否存在与实际字节大小。
        文件名沿用下载端点的路径穿越防护，非法文件名（含路径分隔符或解析后越出房间目录）按 exists=false 处理；
        房间目录不存在时其下全部文件按 exists=false 处理。请求 items 总量上限 100，超限返回 400。
      operationId: getRecordingFileStats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingFileStatsRequest"
      responses:
        "200":
          description: 各房间文件的磁盘存在性与大小
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingFileStatsResponse"
        "400":
          description: 请求体缺失或 items 超过上限
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
  /api/{roomId}/recordings/{fileName}:
    get:
      summary: 下载录播文件
      description: 下载录播文件二进制内容；支持 HTTP Range 单区间分段下载（返回 206），越界区间返回 416，未携带 Range 时返回完整文件（200）。
      operationId: downloadRecording
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: fileName
          in: path
          required: true
          description: 录播文件名（仅允许平文件名，禁止路径分隔符与穿越）
          schema:
            type: string
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/IfRange"
      responses:
        "200":
          description: 录播文件二进制内容（未携带 Range 或 Range 不被支持时返回完整文件）
          headers:
            Content-Disposition:
              schema:
                type: string
            Accept-Ranges:
              description: 服务端支持的分段单位，固定为 bytes
              schema:
                type: string
                example: bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: 单区间分段内容
          headers:
            Content-Range:
              description: 当前返回的字节区间及文件总大小，如 bytes 0-1023/20480
              schema:
                type: string
            Accept-Ranges:
              description: 服务端支持的分段单位，固定为 bytes
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          description: 请求区间越界（起始位置不小于文件大小）
          headers:
            Content-Range:
              description: 未满足的区间及文件总大小，如 bytes */20480
              schema:
                type: string
        "404":
          description: 文件不存在
        "400":
          description: fileName 非法或文件正在录制中无法下载
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    description: 错误原因（如 "file is still recording and cannot be downloaded"）
  /api/{roomId}/recordings/{fileName}/audio:
    get:
      summary: 录播音频片段（试听）
      description: >-
        按 startMs/endMs 从录播文件抽取音频片段并转码为浏览器可直接播放的格式流式返回。
        片段即最小播放单元，不支持 HTTP Range 分段（忽略 Range 请求头，始终返回 200 完整片段）；
        endMs 超出文件实际长度时输出到文件结尾（不报错）；文件正在录制中返回 400（与下载端点同口径）。
      operationId: downloadRecordingAudioClip
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: fileName
          in: path
          required: true
          description: 录播文件名（仅允许平文件名，禁止路径分隔符与穿越）
          schema:
            type: string
        - name: startMs
          in: query
          required: true
          description: 片段起点（整场录播文件时间轴毫秒，>= 0）
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: endMs
          in: query
          required: true
          description: 片段终点（毫秒，必须大于 startMs；区间长度上限 Recording:AudioClipMaxDurationMs，默认 300000）
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 片段音频（mp3，单声道 44.1kHz 96kbps；未探测到 mp3 编码能力时降级 wav，语义不变）
          headers:
            Cache-Control:
              description: 固定 no-store，片段每次现算不缓存
              schema:
                type: string
                example: no-store
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
        "400":
          description: fileName 非法 / 区间参数非法（endMs <= startMs、startMs < 0）/ 区间超上限 / 文件正在录制中
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "404":
          description: 文件不存在
        "500":
          description: ffmpeg 抽取失败（如损坏文件）
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: audio clip failed
  /api/{roomId}/recordings/{fileName}/clip:
    get:
      summary: 录播切片下载
      description: >-
        按 [startMs, endMs] 截取片段（ffmpeg -c copy 保留原始编码，输出 fragmented MP4），
        流式返回独立可播放片段文件。startMs/endMs 必填；区间 ≤ Recording:VideoClipMaxDurationMs（默认 7200000）。
        起点吸附最近关键帧（不晚于所选起点），与预览定位落点一致；endMs 超出文件实际长度时输出到文件结尾。
        文件正在录制中返回 400（与下载端点同口径）。
      operationId: downloadRecordingClip
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: fileName
          in: path
          required: true
          description: 录播文件名（仅允许平文件名，禁止路径分隔符与穿越）
          schema:
            type: string
        - name: startMs
          in: query
          required: true
          description: 片段起点（整场录播文件时间轴毫秒，>= 0）
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: endMs
          in: query
          required: true
          description: 片段终点（毫秒，必须大于 startMs；区间长度上限 Recording:VideoClipMaxDurationMs，默认 7200000）
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 片段视频（fragmented MP4，原始视频/音频编码；-c copy 不转码）
          headers:
            Content-Disposition:
              description: "attachment; filename=\"<ASCII fallback>\"; filename*=UTF-8''<原文件名>-<start>-<end>.mp4"
              schema:
                type: string
            Cache-Control:
              description: 固定 no-store，片段每次现算不缓存
              schema:
                type: string
                example: no-store
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "400":
          description: fileName 非法 / 区间参数非法（缺参、endMs <= startMs、startMs < 0）/ 区间超上限 / 文件正在录制中
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "404":
          description: 文件不存在
        "500":
          description: ffmpeg 切片失败（如损坏文件）
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: video clip failed
  /api/recordings/audio/merge:
    post:
      summary: 多片段音频合并（服务间内部能力）
      description: >-
        按请求顺序抽取多段录播音频并 ffmpeg 单进程 concat 合并输出单个 mp3（单声道 44.1kHz 96kbps；
        未探测到 mp3 编码能力时降级 wav，语义不变），流式返回不落盘。
        供 training synthesize 将断句拼音匹配命中的多条参考拼接为 speaker_prompt；录制中文件返回 400。
      operationId: mergeRecordingAudioClips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingAudioMergeRequest"
      responses:
        "200":
          description: 合并音频（mp3；无 mp3 编码能力时降级 wav，语义不变）
          headers:
            Cache-Control:
              description: 固定 no-store，合并每次现算不缓存
              schema:
                type: string
                example: no-store
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
        "400":
          description: '{"error": "items is required"/"too many items"/"invalid time range"/"total duration too long"/"recording in progress"}'
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "404":
          description: '{"error": "file not found"}（任一文件不存在/非法文件名）'
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "500":
          description: '{"error": "audio merge failed"}（ffmpeg 合并失败）'
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
components:
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Range:
      name: Range
      in: header
      required: false
      description: 字节区间请求，如 bytes=0-1023；仅支持单区间，多区间请求回退为 200 返回完整文件
      schema:
        type: string
    IfRange:
      name: If-Range
      in: header
      required: false
      description: 条件 Range，校验失败（值与当前文件不匹配）时回退为 200 返回完整文件
      schema:
        type: string
  schemas:
    RecordingAudioMergeRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 按顺序合并的片段，1 ~ Recording:AudioMergeMaxItems（默认 16）
          items:
            $ref: "#/components/schemas/RecordingAudioMergeItem"
    RecordingAudioMergeItem:
      type: object
      required: [roomId, fileName, startMs, endMs]
      properties:
        roomId:
          type: integer
          format: int64
        fileName:
          type: string
          description: 录播文件名（仅允许平文件名，禁止路径分隔符与穿越）
        startMs:
          type: integer
          format: int64
          minimum: 0
          description: 片段起点（毫秒）
        endMs:
          type: integer
          format: int64
          description: 片段终点（毫秒，必须大于 startMs；单段 ≤ Recording:AudioClipMaxDurationMs，总时长 ≤ Recording:AudioMergeMaxTotalDurationMs）
    RecordingStatus:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        state:
          type: string
          enum: [not_live, recording, error]
        hostName:
          type: string
          nullable: true
          description: 执行录制的实例 hostname
        sessionTitle:
          type: string
          nullable: true
          description: 当前录制场次名称
        files:
          type: array
          items:
            type: string
          description: 当前场次产出文件名
        error:
          type: string
          nullable: true
          description: state=error 时的原因
        updatedAt:
          type: string
          format: date-time
    RecordingStatusList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecordingStatus"
    RecordingFileStatsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 待查询的房间与文件名分组，总量上限 100
          items:
            $ref: "#/components/schemas/RecordingFileStatsRoomRequest"
    RecordingFileStatsRoomRequest:
      type: object
      required: [roomId, files]
      properties:
        roomId:
          type: integer
          format: int64
        files:
          type: array
          items:
            type: string
    RecordingFileStatsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecordingFileStatsRoom"
    RecordingFileStatsRoom:
      type: object
      properties:
        roomId:
          type: integer
          format: int64
        files:
          type: array
          items:
            $ref: "#/components/schemas/RecordingFileStat"
    RecordingFileStat:
      type: object
      required: [name, exists]
      properties:
        name:
          type: string
        exists:
          type: boolean
        size:
          type: integer
          format: int64
          nullable: true
          description: 存在时的实际字节数；不存在为 null
    RecordingFileList:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/RecordingFile"
    RecordingFile:
      type: object
      required: [name, size, createdAt, info]
      properties:
        name:
          type: string
          description: 录播文件名（平文件名）
        size:
          type: integer
          format: int64
          description: 文件大小（字节）
        createdAt:
          type: string
          format: date-time
          description: 文件创建时间（UTC）
        info:
          $ref: "#/components/schemas/RecordingSessionInfo"
    RecordingSessionInfo:
      type: object
      required: [recordingId, title, mid, startedAt, endedAt]
      properties:
        recordingId:
          type: string
          description: 所属场次归档记录标识
        title:
          type: string
          description: 场次标题（直播标题）
        mid:
          type: integer
          format: int64
          description: 主播 mid
        startedAt:
          type: string
          format: date-time
          description: 场次开始（录制开始）时间（UTC）
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: 场次结束时间（UTC）；未正常收尾为 null
