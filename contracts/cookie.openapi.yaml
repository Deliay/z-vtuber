openapi: 3.1.0
info:
  title: Cookie Service API
  version: 1.0.0
  description: 无头浏览器 Cookie 服务 API（统一前缀 /api/cookie）
servers:
  - url: /
paths:
  /api/cookie/accounts:
    get:
      summary: 列出全部帐号 session
      operationId: listAccounts
      responses:
        "200":
          description: 帐号 session 列表（不含 cookie 原文）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
    post:
      summary: 新增帐号（扫码登录）
      operationId: createAccount
      responses:
        "202":
          description: 创建成功，返回登录二维码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAccount"
        "429":
          description: 并发登录 session 上限
  /api/cookie/accounts/{accountId}:
    get:
      summary: 查询帐号 session 状态
      operationId: getAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 帐号 session 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
        "404":
          description: 帐号不存在
    delete:
      summary: 删除帐号 session
      operationId: deleteAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 删除成功
  /api/cookie/available:
    get:
      summary: 可用 cookie 列表
      operationId: listAvailableCookies
      responses:
        "200":
          description: 可用 cookie 列表（不含 cookie 原文）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieList"
  /api/cookie/checkout:
    post:
      summary: 取下一个可用 cookie（round-robin）
      operationId: checkoutCookie
      responses:
        "200":
          description: 成功获取 cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieCheckout"
        "404":
          description: 无可用 cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cookie/report-invalid:
    post:
      summary: 阻塞式宣告失效并尝试即时刷新
      operationId: reportInvalidCookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInvalidRequest"
      responses:
        "200":
          description: 刷新成功，返回新 cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieCheckout"
        "404":
          description: cookieId 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: session 失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInvalidResponse"
        "504":
          description: 超时上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cookie/cooldown:
    post:
      summary: 设置 cookie 冷却（风控冷却语义）
      operationId: setCookieCooldown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CooldownRequest"
      responses:
        "204":
          description: 冷却设置成功
        "404":
          description: cookieId 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cookie/weibo/accounts:
    get:
      summary: 列出全部微博帐号 session
      operationId: listWeiboAccounts
      responses:
        "200":
          description: 帐号 session 列表（不含 cookie 原文）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
    post:
      summary: 新增微博帐号（扫码登录）
      operationId: createWeiboAccount
      responses:
        "202":
          description: 创建成功，返回登录二维码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingAccount"
        "429":
          description: 并发登录 session 上限
  /api/cookie/weibo/accounts/{accountId}:
    get:
      summary: 查询微博帐号 session 状态
      operationId: getWeiboAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 帐号 session 状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
        "404":
          description: 帐号不存在
    delete:
      summary: 删除微博帐号 session
      operationId: deleteWeiboAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 删除成功
  /api/cookie/weibo/available:
    get:
      summary: 可用微博 cookie 列表
      operationId: listAvailableWeiboCookies
      responses:
        "200":
          description: 可用 cookie 列表（不含 cookie 原文）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieList"
  /api/cookie/weibo/checkout:
    post:
      summary: 取下一个可用微博 cookie（round-robin）
      operationId: checkoutWeiboCookie
      responses:
        "200":
          description: 成功获取 cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieCheckout"
        "404":
          description: 无可用 cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cookie/weibo/report-invalid:
    post:
      summary: 阻塞式宣告失效并尝试即时刷新
      operationId: reportInvalidWeiboCookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInvalidRequest"
      responses:
        "200":
          description: 刷新成功，返回新 cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CookieCheckout"
        "404":
          description: cookieId 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: session 失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInvalidResponse"
        "504":
          description: 超时上限
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cookie/weibo/cooldown:
    post:
      summary: 设置微博 cookie 冷却（风控冷却语义）
      operationId: setWeiboCookieCooldown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CooldownRequest"
      responses:
        "204":
          description: 冷却设置成功
        "404":
          description: cookieId 不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cookie/weibo/proxy:
    post:
      summary: 在登录浏览器会话内代理发起微博请求（页面上下文 XHR）
      operationId: proxyWeiboRequest
      description: |
        在 cookieId 所属帐号的登录浏览器会话页面上下文内向微博发起 GET 请求，原样回传微博
        原始状态码与响应体（含风控响应）。白名单约束目标为 m.weibo.cn 的 /api/* 路径，
        端点不得成为开放代理。v1 仅支持 GET 语义（path 含 query）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyWeiboRequest"
      responses:
        "200":
          description: 微博原始响应透传
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyWeiboResponse"
        "400":
          description: 目标非白名单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: cookieId 不存在或非 active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: 关联会话已失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInvalidResponse"
        "502":
          description: 浏览器侧请求失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: 超时
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    AccountList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountItem"
    AccountItem:
      type: object
      properties:
        accountId:
          type: string
        platform:
          type: string
          enum: [bilibili, weibo]
        status:
          type: string
          enum: [pending_login, active, expired, invalid]
        mid:
          type: integer
          format: int64
        uname:
          type: string
        cookieId:
          type: string
          description: 当前关联的 Cookie 池记录 ID（无关联时为空）
        cookieStatus:
          type: string
        lastRefreshAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    PendingAccount:
      type: object
      properties:
        accountId:
          type: string
        status:
          type: string
          enum: [pending_login]
        qrCodeImage:
          type: string
          description: base64 encoded PNG image
        expiresAt:
          type: string
          format: date-time
    AccountStatus:
      type: object
      properties:
        accountId:
          type: string
        status:
          type: string
          enum: [pending_login, active, expired, invalid]
        mid:
          type: integer
          format: int64
        uname:
          type: string
        qrCodeImage:
          type: string
          description: base64 encoded PNG image (only for pending_login)
        expiresAt:
          type: string
          format: date-time
    CookieList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CookieItem"
    CookieItem:
      type: object
      properties:
        cookieId:
          type: string
        accountId:
          type: string
        uname:
          type: string
        status:
          type: string
        lastCheckedAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        lastRefreshAt:
          type: string
          format: date-time
    CookieCheckout:
      type: object
      properties:
        cookieId:
          type: string
        accountId:
          type: string
        cookie:
          type: string
          description: cookie 原文
        refreshed:
          type: boolean
          description: 是否为刷新后的新 cookie (仅 report-invalid 返回)
    ReportInvalidRequest:
      type: object
      required: [cookieId]
      properties:
        cookieId:
          type: string
    SessionInvalidResponse:
      type: object
      description: |
        事件 reason 说明：
        - session_invalid: session 失效（包括 report-invalid 和 refresh_nav_missing）
        - no_session: 无关联 session 的历史 cookie（仅事件流使用，410 响应统一返回 session_invalid）
        - account_removed: 帐号被删除
      properties:
        cookieId:
          type: string
        accountId:
          type: string
        reason:
          type: string
          enum: [session_invalid, no_session, account_removed]
    CooldownRequest:
      type: object
      required: [cookieId, durationSeconds]
      properties:
        cookieId:
          type: string
        durationSeconds:
          type: integer
          minimum: 1
    ProxyWeiboRequest:
      type: object
      required: [cookieId, path]
      properties:
        cookieId:
          type: string
          description: 微博 Cookie 池记录 ID
        path:
          type: string
          description: 目标 API 路径（含 query），必须以 /api/ 开头且不含 scheme/host/回溯符
    ProxyWeiboResponse:
      type: object
      properties:
        status:
          type: integer
          description: 微博原始 HTTP 状态码
        body:
          type: string
          description: 微博原始响应体文本
    ErrorResponse:
      type: object
      properties:
        error:
          type: string